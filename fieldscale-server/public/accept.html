<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review &amp; Approve — Fieldscale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{font-family:'IBM Plex Sans',Arial,sans-serif;color:#1C1E22;margin:0;background:#F6F3EA;font-size:14px}
  .sheet{max-width:820px;margin:24px auto;background:#fff;border:1px solid #E4DFCF;border-radius:4px;padding:36px 40px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  .head{display:flex;justify-content:space-between;border-bottom:3px solid #0E2A47;padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .co h1{font-family:'Oswald',sans-serif;font-size:24px;margin:0 0 4px;color:#0E2A47}
  .co .sub{color:#7C8896;font-size:12px}
  .doc{text-align:right}.doc .big{font-family:'Oswald',sans-serif;font-size:24px;color:#E8722C;letter-spacing:1px}
  .doc .meta{color:#7C8896;font-size:12px;margin-top:6px;line-height:1.5}
  .parties{display:flex;gap:40px;margin-bottom:18px;flex-wrap:wrap}
  .parties h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7C8896;margin:0 0 4px}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  th{background:#0E2A47;color:#F6F3EA;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  th.r,td.r{text-align:right} th.c,td.c{text-align:center}
  td{padding:8px 10px;border-bottom:1px solid #E4DFCF;vertical-align:top}
  td .code{color:#7C8896;font-size:11px;margin-top:2px}
  .totals{width:300px;margin-left:auto}
  .totals .tr{display:flex;justify-content:space-between;padding:5px 0}
  .totals .tr.total{border-top:2px solid #1C1E22;margin-top:4px;padding-top:8px;font-family:'Oswald',sans-serif;font-size:18px;color:#0E2A47}
  .sec{margin-top:22px} .sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7C8896;margin:0 0 6px;border-bottom:1px solid #E4DFCF;padding-bottom:4px}
  .sec .body{white-space:pre-wrap;line-height:1.5}
  .approve{margin-top:30px;border-top:2px dashed #E4DFCF;padding-top:22px}
  .approve h3{font-family:'Oswald',sans-serif;font-size:18px;margin:0 0 6px}
  .approve p{color:#7C8896;margin:0 0 14px}
  .approve .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .approve input{border:1px solid #B9C2CB;border-radius:3px;padding:10px 12px;font-size:15px;font-family:inherit;min-width:240px}
  .approve button{background:#4A9B6E;color:#fff;border:none;border-radius:3px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .approve button:hover{background:#3f8a60}
  .approve button:disabled{opacity:.5;cursor:default}
  .accepted{margin-top:30px;background:rgba(74,155,110,.12);border:1px solid rgba(74,155,110,.5);border-radius:4px;padding:18px 20px;color:#2f6b4a}
  .accepted strong{font-size:16px}
  .msg{padding:60px 20px;text-align:center;color:#7C8896}
  @media (max-width:640px){ .sheet{margin:0;border-radius:0;padding:22px 18px} }
</style>
</head>
<body>
<div id="root"><div class="msg">Loading…</div></div>
<script>
const token=new URLSearchParams(location.search).get('token');
function money(n){ return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Match the estimate editor's line math so the client sees the same numbers.
function lineAmount(l){ if(l.mode==='flat') return (Number(l.qty)||0)*(Number(l.unitPrice)||0);
  if(l.mode==='buildup') return (Number(l.material)||0)+(Number(l.laborHours)||0)*(Number(l.laborRate)||0);
  return (Number(l.qty)||0)*(Number(l.unitCost)||0); }
function lineUnit(l){ const q=Number(l.qty)||0; const a=lineAmount(l); return q>0?a/q:a; }

async function api(path, opts={}){
  const res=await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'Something went wrong.');
  return data;
}
function money0(n){ return money(n); }
function computeTotals(d){
  const subtotal=(d.lines||[]).reduce((s,l)=>s+lineAmount(l),0);
  const markup=subtotal*(Number(d.markupPct)||0)/100;
  const price=subtotal+markup;
  const discInput=Number(d.discount)||0;
  let discount=d.discountType==='amt'?discInput:price*discInput/100;
  discount=Math.min(Math.max(discount,0),price);
  const taxable=price-discount;
  const tax=taxable*(Number(d.taxPct)||0)/100;
  return { subtotal:price, discount, tax, total:taxable+tax };
}
function render(d){
  const t=computeTotals(d);
  const co=d.company||{}, cl=d.client||{};
  const coLines=[co.phone,co.email,co.website,co.license?('Lic# '+co.license):'',co.address].filter(Boolean).map(esc).join(' · ');
  const rows=(d.lines||[]).map((l,i)=>`<tr><td class="c">${i+1}</td>
    <td>${esc(l.name)}${l.code?`<div class="code">${esc(l.code)}</div>`:''}</td>
    <td class="r">${Number(l.qty)||0}</td><td>${esc(l.unit)}</td>
    <td class="r">${money(lineUnit(l))}</td><td class="r">${money(lineAmount(l))}</td></tr>`).join('');
  const sig=d.signature;
  const approveBlock = sig&&sig.name
    ? `<div class="accepted"><strong>✓ Approved</strong><br>Accepted by <strong>${esc(sig.name)}</strong> on ${new Date(sig.at).toLocaleString()}.</div>`
    : `<div class="approve"><h3>Approve this estimate</h3>
        <p>By typing your name below and clicking Approve, you accept this proposal and its total of <strong>${money(t.total)}</strong>.</p>
        <div class="row">
          <input id="sig" placeholder="Type your full name" />
          <button id="approve-btn">Approve &amp; accept</button>
        </div></div>`;
  document.getElementById('root').innerHTML=`<div class="sheet">
    <div class="head">
      <div class="co">${co.logo?`<img src="${esc(co.logo)}" style="max-height:56px;max-width:200px;display:block;margin-bottom:8px">`:''}<h1>${esc(co.name||'Estimate')}</h1><div class="sub">${coLines}</div></div>
      <div class="doc"><div class="big">ESTIMATE</div><div class="meta">
        ${d.estimateNo?('No. '+esc(d.estimateNo)+'<br>'):''}${d.date?('Date: '+esc(d.date)+'<br>'):''}${d.validUntil?('Valid until: '+esc(d.validUntil)):''}</div></div>
    </div>
    <div class="parties">
      <div><h4>Prepared for</h4><div><strong>${esc(cl.name||'—')}</strong>${cl.address?('<br>'+esc(cl.address)):''}</div></div>
      ${d.project?`<div><h4>Project</h4><div>${esc(d.project)}</div></div>`:''}
    </div>
    <table><thead><tr><th class="c">#</th><th>Description</th><th class="r">Qty</th><th>Unit</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:#7C8896;padding:20px">No line items.</td></tr>'}</tbody></table>
    <div class="totals">
      <div class="tr"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
      ${t.discount>0?`<div class="tr"><span>Discount</span><span>-${money(t.discount)}</span></div>`:''}
      ${d.taxPct?`<div class="tr"><span>Tax (${d.taxPct}%)</span><span>${money(t.tax)}</span></div>`:''}
      <div class="tr total"><span>Total</span><span>${money(t.total)}</span></div>
    </div>
    ${d.notes?`<div class="sec"><h4>Notes</h4><div class="body">${esc(d.notes)}</div></div>`:''}
    ${d.terms?`<div class="sec"><h4>Terms</h4><div class="body">${esc(d.terms)}</div></div>`:''}
    ${approveBlock}
  </div>`;
  const btn=document.getElementById('approve-btn');
  if(btn){ btn.addEventListener('click', async ()=>{
    const name=(document.getElementById('sig').value||'').trim();
    if(!name){ document.getElementById('sig').focus(); return; }
    btn.disabled=true; btn.textContent='Submitting…';
    try{
      await api('/api/public/estimate-accept', { method:'POST', body: JSON.stringify({ token, name }) });
      load();
    }catch(err){ btn.disabled=false; btn.textContent='Approve & accept'; alert(err.message); }
  }); }
}
async function load(){
  if(!token){ document.getElementById('root').innerHTML='<div class="msg">This link is missing its code.</div>'; return; }
  try{ const d=await api('/api/public/estimate?token='+encodeURIComponent(token)); render(d); }
  catch(err){ document.getElementById('root').innerHTML='<div class="msg">'+esc(err.message)+'</div>'; }
}
load();
</script>
</body>
</html>
