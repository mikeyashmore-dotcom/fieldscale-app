<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldscale — Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fs-theme.css">
<style>
  .wrap{max-width:1000px}
  .pagebar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .pagebar h1{margin:0}
  .pagebar .spacer{flex:1}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .tile{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px 14px}
  .tile .lab{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel)}
  .tile .v{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;color:var(--ink-navy);margin-top:3px}
  .tile .v.neg{color:var(--danger)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .block{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
  .block h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin:0 0 10px;display:flex;justify-content:space-between}
  .itemrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--paper-line);cursor:pointer}
  .itemrow:last-child{border-bottom:none}
  .itemrow:hover{background:#FbF9F3}
  .itemrow .nm{flex:1;font-size:13px}
  .itemrow .pill{padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:600;text-transform:capitalize;background:var(--paper);color:var(--steel)}
  .itemrow .amt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel)}
  .none{color:var(--steel);font-size:13px;padding:4px 0}
  textarea{min-height:90px;resize:vertical}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper-line)}
  .tl li:last-child{border-bottom:none}
  .tl .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--steel-light)}
  .tl .dot.estimate{background:var(--cyan-dim)} .tl .dot.invoice{background:var(--orange-dim)}
  .tl .dot.job{background:var(--good)} .tl .dot.lead{background:var(--steel)} .tl .dot.note{background:var(--ink-navy)}
  .tl .txt{flex:1;font-size:13px}
  .tl .txt a{color:var(--blueprint-2)}
  .tl .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);white-space:nowrap}
  .addnote{display:flex;gap:8px;margin-bottom:12px}
  @media (max-width:760px){ .cols{grid-template-columns:1fr} }
</style>
<meta name="fs-module" content="crm">
<script src="/app-nav.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>FIELDSCALE</div>
  <nav>
    <a href="/">Takeoff</a>
    <a href="/leads.html">Leads</a>
    <a href="/customers.html" class="active">Customers</a>
    <a href="/proposals.html">Estimates</a>
    <a href="/jobs.html">Jobs</a>
    <a href="/schedule.html">Schedule</a>
    <a href="/purchase-orders.html">Purchase Orders</a>
    <a href="/workorders.html">Work Orders</a>
    <a href="/invoices.html">Invoices</a>
    <a href="/estimates.html">Price Book</a>
    <a href="/followups.html">Follow-ups</a>
    <a href="/reports.html">Reports</a>
    <a href="/company.html">Company</a>
    <a href="/admin.html" id="owner-nav">Owner</a>
  </nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <a href="#" id="logout-link" style="color:var(--steel-light);font-size:13px;margin-left:14px;text-decoration:none">Log out</a>
</header>

<div class="wrap">
  <div id="loading" class="loading">Loading…</div>
  <div id="content" style="display:none">
    <div class="pagebar">
      <a href="/customers.html" class="btn ghost">← Customers</a>
      <h1 id="cust-name"></h1>
      <div class="spacer"></div>
      <button class="btn ghost" id="stmt-btn" title="Print an account statement for this customer">🧾 Statement</button>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="cols">
      <div>
        <div class="block"><h3><span>Leads</span></h3><div id="leads"></div></div>
        <div class="block"><h3><span>Estimates</span></h3><div id="estimates"></div></div>
        <div class="block"><h3><span>Jobs</span></h3><div id="jobs"></div></div>
        <div class="block"><h3><span>Invoices</span></h3><div id="invoices"></div></div>
      </div>
      <div>
        <div class="block">
          <h3><span>Notes</span><button class="btn ghost" id="save-notes" style="font-size:11px;padding:3px 10px">Save</button></h3>
          <textarea id="notes" placeholder="Anything worth remembering about this customer…"></textarea>
        </div>
        <div class="block">
          <h3><span>Activity timeline</span></h3>
          <div class="addnote">
            <input id="note-input" placeholder="Log a call, email or note…" style="flex:1" />
            <button class="btn ghost" id="add-note">Add</button>
          </div>
          <ul class="tl" id="timeline"></ul>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN_STORAGE='fieldscale_token';
function getToken(){ return localStorage.getItem(TOKEN_STORAGE); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='logout-link'){ e.preventDefault(); localStorage.removeItem('fieldscale_token'); localStorage.removeItem('fieldscale_username'); location.href='/'; } });
if(!getToken()){ location.href='/'; }
const custNameParam = new URLSearchParams(location.search).get('name');
if(!custNameParam){ location.href='/customers.html'; }
async function apiFetch(path, options={}){
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  const t=getToken(); if(t) headers['Authorization']='Bearer '+t;
  const res=await fetch(path, Object.assign({}, options, {headers}));
  if(res.status===401){ location.href='/'; throw new Error('Session expired'); }
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Request failed');
  return data;
}
function money(n){ return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ms){ if(!ms) return ''; return new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
let toastTimer; function toast(m,e){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2200); }

function itemRow(href, name, status, amt){
  return `<div class="itemrow" onclick="location.href='${href}'">
    <span class="nm">${esc(name)||'(untitled)'}</span>
    ${status?`<span class="pill">${esc(status)}</span>`:''}
    ${amt?`<span class="amt">${money(amt)}</span>`:''}</div>`;
}
function fillList(id, arr, fn){
  const el=document.getElementById(id);
  el.innerHTML = arr.length ? arr.map(fn).join('') : '<div class="none">None yet.</div>';
}
function renderTimeline(tl){
  const el=document.getElementById('timeline');
  if(!tl.length){ el.innerHTML='<li><span class="txt none">No activity yet.</span></li>'; return; }
  el.innerHTML=tl.map(e=>`<li>
    <span class="dot ${esc(e.type)}"></span>
    <span class="txt">${e.link?`<a href="${esc(e.link)}">${esc(e.text)}</a>`:esc(e.text)}</span>
    <span class="when">${fmtDate(e.ts)}</span></li>`).join('');
}

let data=null;
function render(){
  document.getElementById('cust-name').textContent=data.name||'(no name)';
  const t=data.totals||{};
  document.getElementById('tiles').innerHTML=
    `<div class="tile"><div class="lab">Quoted</div><div class="v">${money(t.quoted)}</div></div>`+
    `<div class="tile"><div class="lab">Invoiced</div><div class="v">${money(t.invoiced)}</div></div>`+
    `<div class="tile"><div class="lab">Paid</div><div class="v">${money(t.paid)}</div></div>`+
    `<div class="tile"><div class="lab">Outstanding</div><div class="v ${t.outstanding>0.005?'neg':''}">${money(t.outstanding)}</div></div>`;
  fillList('leads', data.leads, l=>itemRow('/lead.html?id='+l.id, l.name, l.stage, l.value));
  fillList('estimates', data.estimates, e=>itemRow('/estimate.html?id='+e.id, e.name, e.status, e.total));
  fillList('jobs', data.jobs, j=>itemRow('/job.html?id='+j.id, j.name, j.status, 0));
  fillList('invoices', data.invoices, i=>itemRow('/invoice.html?id='+i.id, i.name, i.status, i.total));
  document.getElementById('notes').value=data.notes||'';
  renderTimeline(data.timeline||[]);
}

document.getElementById('save-notes').addEventListener('click', async ()=>{
  try{ await apiFetch('/api/customer', { method:'PUT', body: JSON.stringify({ name:data.name, notes:document.getElementById('notes').value }) }); toast('Notes saved.'); }
  catch(err){ toast(err.message,true); }
});
async function addNote(){
  const inp=document.getElementById('note-input'); const v=(inp.value||'').trim(); if(!v) return;
  try{
    await apiFetch('/api/customer', { method:'POST', body: JSON.stringify({ name:data.name, activityText:v }) });
    inp.value=''; await load(); toast('Added to timeline.');
  }catch(err){ toast(err.message,true); }
}
document.getElementById('add-note').addEventListener('click', addNote);
document.getElementById('note-input').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addNote(); } });

let company={};
document.getElementById('stmt-btn').addEventListener('click', ()=>{
  const t=data.totals||{}; const co=company||{};
  const coLines=[co.phone,co.email,co.website,co.address].filter(Boolean).map(esc).join(' &middot; ');
  const rows=(data.invoices||[]).slice().sort((a,b)=>a.updatedAt-b.updatedAt).map(i=>{
    const bal=(Number(i.total)||0)-(Number(i.amountPaid)||0);
    return `<tr><td>${esc(i.name)||'Invoice'}</td><td>${fmtDate(i.updatedAt)}</td><td class="s">${esc(i.status)}</td>
      <td class="r">${money(i.total)}</td><td class="r">${money(i.amountPaid)}</td><td class="r">${money(bal)}</td></tr>`;
  }).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Statement — ${esc(data.name)}</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{font-family:'IBM Plex Sans',Arial,sans-serif;color:#1C1E22;margin:0;padding:40px;font-size:13px}
.head{display:flex;justify-content:space-between;border-bottom:3px solid #0E2A47;padding-bottom:16px;margin-bottom:20px}
.co h1{font-family:'Oswald',sans-serif;font-size:22px;margin:0 0 4px;color:#0E2A47}.co .sub{color:#7C8896;font-size:12px}
.doc{text-align:right}.doc .big{font-family:'Oswald',sans-serif;font-size:24px;color:#E8722C}.doc .meta{color:#7C8896;font-size:12px;margin-top:6px}
table{width:100%;border-collapse:collapse;margin-bottom:16px}th{background:#0E2A47;color:#F6F3EA;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase}
th.r,td.r{text-align:right}td{padding:8px 10px;border-bottom:1px solid #E4DFCF}td.s{text-transform:capitalize;color:#7C8896}
.tot{width:280px;margin-left:auto}.tot .tr{display:flex;justify-content:space-between;padding:5px 0}
.tot .tr.bal{border-top:2px solid #1C1E22;margin-top:4px;padding-top:8px;font-family:'Oswald',sans-serif;font-size:17px;color:#C0392B}
@media print{body{padding:0}.noprint{display:none}@page{margin:16mm}}
.bar{position:fixed;top:0;left:0;right:0;background:#0E2A47;padding:10px;text-align:center}.bar button{background:#E8722C;color:#fff;border:none;padding:9px 20px;border-radius:3px;cursor:pointer}.sp{height:52px}</style></head><body>
<div class="bar noprint"><button onclick="window.print()">Save as PDF / Print</button></div><div class="sp noprint"></div>
<div class="head"><div class="co">${co.logo?`<img src="${esc(co.logo)}" style="max-height:50px;margin-bottom:8px">`:''}<h1>${esc(co.name||'Statement')}</h1><div class="sub">${coLines}</div></div>
<div class="doc"><div class="big">STATEMENT</div><div class="meta">For: <strong>${esc(data.name)}</strong><br>${new Date().toLocaleDateString()}</div></div></div>
<table><thead><tr><th>Invoice</th><th>Date</th><th>Status</th><th class="r">Amount</th><th class="r">Paid</th><th class="r">Balance</th></tr></thead>
<tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:#7C8896;padding:20px">No invoices.</td></tr>'}</tbody></table>
<div class="tot"><div class="tr"><span>Total invoiced</span><span>${money(t.invoiced)}</span></div>
<div class="tr"><span>Total paid</span><span>${money(t.paid)}</span></div>
<div class="tr bal"><span>Balance due</span><span>${money(t.outstanding)}</span></div></div></body></html>`;
  const w=window.open('','_blank'); if(!w){ toast('Please allow pop-ups to print the statement.',true); return; }
  w.document.open(); w.document.write(html); w.document.close();
});

async function load(){
  data=await apiFetch('/api/customer?name='+encodeURIComponent(custNameParam));
  render();
}
async function init(){
  try{ const me=await apiFetch('/api/me'); document.getElementById('who').textContent=me.username; }catch(e){ return; }
  try{ const c=await apiFetch('/api/company'); company=c.profile||{}; }catch(e){ company={}; }
  try{
    await load();
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(err){ document.getElementById('loading').textContent='Could not load this customer: '+err.message; }
}
init();
</script>
</body>
</html>
