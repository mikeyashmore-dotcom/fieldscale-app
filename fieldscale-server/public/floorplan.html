<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldscale — Floor Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fs-theme.css">
<meta name="fs-module" content="estimating">
<script src="/app-nav.js"></script>
<style>
  body{overflow:hidden}
  .fp-wrap{max-width:none;margin:0;padding:0;display:flex;flex-direction:column;height:calc(100vh - 52px)}
  .fp-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--paper-line);flex-wrap:wrap}
  .fp-bar input.name{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--heading);border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:var(--radius);width:220px}
  .fp-bar input.name:hover{border-color:var(--paper-line)} .fp-bar input.name:focus{border-color:var(--steel-light);outline:none;background:var(--surface)}
  .fp-bar .save-state{font-size:12px;color:var(--steel);min-width:74px}
  .fp-bar .grow{flex:1}
  .fp-body{flex:1;display:flex;min-height:0}
  .fp-tools{width:186px;background:var(--surface);border-right:1px solid var(--paper-line);overflow-y:auto;padding:10px}
  .fp-tools h4{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);margin:14px 0 6px}
  .fp-tools h4:first-child{margin-top:2px}
  .tool{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:7px 9px;font-size:12.5px;cursor:pointer;margin-bottom:5px;color:var(--charcoal);font-family:inherit}
  .tool:hover{background:var(--paper);border-color:var(--steel-light)}
  .tool.active{background:var(--ink-navy);color:#fff;border-color:var(--heading)}
  .tool .ico{width:20px;text-align:center;flex:none}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .pgrid .tool{margin-bottom:0;flex-direction:column;gap:3px;padding:8px 4px;font-size:11px;text-align:center}
  .pgrid .tool .ico{width:auto;font-size:16px}
  .fp-canvas-wrap{flex:1;position:relative;background:#EEF1F5;min-width:0}
  #fp-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .fp-canvas-wrap.select #fp-canvas{cursor:default}
  .fp-props{position:absolute;top:12px;left:12px;background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 12px;box-shadow:0 3px 12px rgba(14,42,71,.1);font-size:12px;display:none;max-width:230px}
  .fp-props.show{display:block}
  .fp-props label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);margin:6px 0 2px}
  .fp-props input,.fp-props select{width:100%;padding:5px 7px;border:1px solid var(--steel-light);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--surface)}
  .fp-props .row{display:flex;gap:6px;margin-top:8px}
  .fp-props .row .btn{flex:1;padding:5px 6px;font-size:11px}
  .fp-props .meta{color:var(--steel);font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:4px}
  .fp-zoom{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:4px}
  .fp-zoom button{width:34px;height:34px;border:1px solid var(--paper-line);background:var(--surface);border-radius:var(--radius);font-size:17px;cursor:pointer;color:var(--heading);box-shadow:0 1px 3px rgba(14,42,71,.08)}
  .fp-zoom button:hover{background:var(--paper)}
  .fp-hint{position:absolute;bottom:14px;left:14px;background:rgba(14,42,71,.9);color:#fff;font-size:12px;padding:6px 11px;border-radius:var(--radius);max-width:340px;line-height:1.4}
  .fp-tip{position:absolute;pointer-events:none;background:#17293D;color:#fff;font-size:11px;font-weight:500;padding:4px 8px;border-radius:4px;white-space:nowrap;display:none;z-index:6;box-shadow:0 2px 7px rgba(14,42,71,.28);transform:translateY(-50%)}
  .fp-tip.show{display:block}
  .wallh-row{display:flex;align-items:center;gap:6px;margin:2px 0 4px;font-size:11px;color:var(--steel)}
  .wallh-row input{width:50px;padding:4px 6px;border:1px solid var(--paper-line);border-radius:3px;font-family:inherit}
  .wallh-row select{padding:4px 6px;border:1px solid var(--paper-line);border-radius:3px;font-family:inherit;font-size:11px}
  .fp-totals{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:7px 11px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--heading);box-shadow:0 2px 8px rgba(14,42,71,.08);line-height:1.55;display:none}
  .fp-totals.show{display:block}
  .fp-totals b{color:var(--orange-dim);font-size:13px}
  .fp-modal{position:absolute;inset:0;background:rgba(14,42,71,.35);display:none;align-items:center;justify-content:center;z-index:9}
  .fp-modal.show{display:flex}
  .fp-modal .card{background:var(--surface);border-radius:6px;padding:20px 22px;box-shadow:0 8px 30px rgba(14,42,71,.3);max-width:360px;text-align:center}
  .fp-modal h3{font-family:'Oswald',sans-serif;margin:0 0 4px;color:var(--heading);font-size:18px}
  .fp-modal p{margin:0 0 15px;color:var(--steel);font-size:13px;line-height:1.4}
  .fp-orient{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
  .fp-orient button{border:1px solid var(--steel-light);background:var(--surface);border-radius:5px;padding:14px 10px;cursor:pointer;width:120px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--charcoal)}
  .fp-orient button:hover{border-color:var(--heading);background:var(--paper)}
  .fp-orient .glyph{display:block;margin:0 auto 8px;border:2px solid var(--ink-navy);border-radius:2px}
  .btn.tiny{padding:6px 10px;font-size:12px}
  @media (max-width:720px){ .fp-tools{width:150px} .fp-bar input.name{width:130px} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>FIELDSCALE</div>
  <nav></nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <a href="#" id="logout-link" style="color:var(--steel-light);font-size:13px;margin-left:14px;text-decoration:none">Log out</a>
</header>

<div class="fp-wrap">
  <div class="fp-bar">
    <a href="/plans.html" class="btn tiny" style="text-decoration:none">← Plans</a>
    <input class="name" id="plan-name" placeholder="Plan name" />
    <input class="name" id="plan-client" placeholder="Client (optional)" style="width:170px;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:14px;color:var(--charcoal)" />
    <span class="save-state" id="save-state"></span>
    <div class="grow"></div>
    <button class="btn tiny" id="btn-png">⤓ PNG</button>
    <button class="btn tiny" id="btn-print">🖶 Print</button>
  </div>
  <div class="fp-body">
    <div class="fp-tools" id="tools">
      <h4>Draw</h4>
      <button class="tool" data-tool="select"><span class="ico">▲</span> Select / move</button>
      <button class="tool" data-tool="wall"><span class="ico">▬</span> Wall</button>
      <div class="wallh-row">Wall height <input id="wall-h" type="number" min="1" step="0.5" value="8"> ft</div>
      <div class="wallh-row">Framing <select id="wall-stud"><option>2x4</option><option>2x6</option><option>2x8</option></select></div>
      <button class="tool" data-tool="line"><span class="ico">╱</span> Line</button>
      <button class="tool" data-tool="room"><span class="ico">▭</span> Room</button>
      <button class="tool" data-tool="text"><span class="ico">T</span> Label</button>
      <h4>Openings</h4>
      <div class="pgrid" id="pal-openings"></div>
      <h4>Bathroom</h4>
      <div class="pgrid" id="pal-bath"></div>
      <h4>Kitchen &amp; Laundry</h4>
      <div class="pgrid" id="pal-kitchen"></div>
      <h4>Rooms &amp; Other</h4>
      <div class="pgrid" id="pal-other"></div>
    </div>
    <div class="fp-canvas-wrap select" id="canvas-wrap">
      <canvas id="fp-canvas"></canvas>
      <div class="fp-props" id="props"></div>
      <div class="fp-zoom">
        <button id="z-in" title="Zoom in">+</button>
        <button id="z-out" title="Zoom out">−</button>
        <button id="z-fit" title="Fit to view" style="font-size:12px">FIT</button>
      </div>
      <div class="fp-hint" id="hint"></div>
      <div class="fp-tip" id="fp-tip"></div>
      <div class="fp-totals" id="fp-totals"></div>
      <div class="fp-modal" id="print-modal">
        <div class="card">
          <h3>Print / PDF layout</h3>
          <p>Pick the page orientation — the plan fills the whole page. In the print box, choose “Save as PDF” to get a PDF.</p>
          <div class="fp-orient">
            <button id="po-port"><span class="glyph" style="width:28px;height:36px"></span>Portrait</button>
            <button id="po-land"><span class="glyph" style="width:36px;height:28px"></span>Landscape</button>
          </div>
          <button class="btn tiny" id="po-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TOKEN_STORAGE='fieldscale_token';
function getToken(){ return localStorage.getItem(TOKEN_STORAGE); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='logout-link'){ e.preventDefault(); localStorage.removeItem('fieldscale_token'); localStorage.removeItem('fieldscale_username'); location.href='/'; } });
if(!getToken()){ location.href='/'; }
async function apiFetch(path, options={}){
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  const t=getToken(); if(t) headers['Authorization']='Bearer '+t;
  const res=await fetch(path, Object.assign({}, options, {headers}));
  if(res.status===401){ location.href='/'; throw new Error('Session expired'); }
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Request failed');
  return data;
}
const planId = new URLSearchParams(location.search).get('id');
if(!planId){ location.href='/plans.html'; }

// ---------- Fixture library. Sizes in FEET (unrotated: w=horizontal, h=vertical). ----------
// draw(ctx, w, h) works in a box centred at (0,0): x from -w/2..w/2, y from -h/2..h/2 (pixels).
function tick(ctx,x,y,dx,dy){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx,y+dy); ctx.stroke(); }
const FIX = {
  door:   { label:'Door', w:3, h:3, cat:'openings', ico:'🚪', draw(c,w,h){ const x=-w/2,y=-h/2; tick(c,x,y,0,6); tick(c,x+w,y,0,6); // jambs
              c.beginPath(); c.moveTo(x,y); c.lineTo(x,y+w); c.stroke(); // leaf
              c.beginPath(); c.arc(x,y,w,0,Math.PI/2); c.stroke(); } },
  ddoor:  { label:'Double', w:6, h:3, cat:'openings', ico:'🚪', draw(c,w,h){ const x=-w/2,y=-h/2; tick(c,x,y,0,6); tick(c,x+w,y,0,6);
              c.beginPath(); c.moveTo(x,y); c.lineTo(x,y+w/2); c.stroke(); c.beginPath(); c.arc(x,y,w/2,0,Math.PI/2); c.stroke();
              c.beginPath(); c.moveTo(x+w,y); c.lineTo(x+w,y+w/2); c.stroke(); c.beginPath(); c.arc(x+w,y,w/2,Math.PI/2,Math.PI); c.stroke(); } },
  window: { label:'Window', w:3, h:0.5, cat:'openings', ico:'⊞', draw(c,w,h){ const x=-w/2; c.beginPath(); c.moveTo(x,-h/2); c.lineTo(x+w,-h/2); c.moveTo(x,h/2); c.lineTo(x+w,h/2); c.moveTo(x,0); c.lineTo(x+w,0); c.stroke(); tick(c,x,-h/2,0,h); tick(c,x+w,-h/2,0,h); } },
  opening:{ label:'Opening', w:3, h:0.5, cat:'openings', ico:'▯', draw(c,w,h){ const x=-w/2; tick(c,x,-h/2-3,0,h+6); tick(c,x+w,-h/2-3,0,h+6); } },
  toilet: { label:'Toilet', w:1.5, h:2.5, cat:'bath', ico:'🚽', draw(c,w,h){ c.beginPath(); c.rect(-w/2,-h/2,w,h*0.32); c.stroke(); c.beginPath(); c.ellipse(0,h*0.05,w*0.42,h*0.32,0,0,7); c.stroke(); } },
  tub:    { label:'Tub', w:2.5, h:5, cat:'bath', ico:'🛁', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,8); c.stroke(); rr(c,-w/2+5,-h/2+8,w-10,h-16,6); c.stroke(); c.beginPath(); c.arc(0,h/2-5,2.2,0,7); c.stroke(); } },
  shower: { label:'Shower', w:3, h:3, cat:'bath', ico:'🚿', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.moveTo(-w/2,-h/2); c.lineTo(w/2,h/2); c.moveTo(w/2,-h/2); c.lineTo(-w/2,h/2); c.stroke(); c.beginPath(); c.arc(0,0,2.5,0,7); c.stroke(); } },
  sink:   { label:'Sink', w:2, h:1.6, cat:'bath', ico:'◔', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.ellipse(0,2,w*0.32,h*0.28,0,0,7); c.stroke(); c.beginPath(); c.arc(0,-h/2+3,1.6,Math.PI,0); c.stroke(); } },
  vanity: { label:'Vanity', w:3, h:1.8, cat:'bath', ico:'▤', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.ellipse(0,2,w*0.22,h*0.3,0,0,7); c.stroke(); } },
  ksink:  { label:'Kitch. sink', w:3, h:2, cat:'kitchen', ico:'⊟', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); rr(c,-w/2+3,-h/2+4,w/2-5,h-8,3); c.stroke(); rr(c,3,-h/2+4,w/2-5,h-8,3); c.stroke(); } },
  base:   { label:'Base cab.', w:2, h:2, cat:'kitchen', ico:'▭', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.moveTo(-w/2,h/2-4); c.lineTo(w/2,h/2-4); c.stroke(); } },
  upper:  { label:'Upper cab.', w:2, h:1.2, cat:'kitchen', ico:'▢', dashed:true, draw(c,w,h){ c.save(); c.setLineDash([4,3]); c.strokeRect(-w/2,-h/2,w,h); c.restore(); } },
  island: { label:'Island', w:5, h:3, cat:'kitchen', ico:'▬', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,3); c.stroke(); } },
  fridge: { label:'Fridge', w:3, h:3, cat:'kitchen', ico:'❄', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.moveTo(-w/2+4,-h/2); c.lineTo(-w/2+4,h/2); c.stroke(); } },
  range:  { label:'Range', w:2.5, h:2.5, cat:'kitchen', ico:'▦', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); const r=w*0.16; [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(p=>{ c.beginPath(); c.arc(p[0]*w*0.22,p[1]*h*0.22,r,0,7); c.stroke(); }); } },
  dw:     { label:'Dishw.', w:2, h:2, cat:'kitchen', ico:'▨', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.arc(0,0,w*0.28,0,7); c.stroke(); } },
  washer: { label:'Washer', w:2.5, h:2.5, cat:'kitchen', ico:'○', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.arc(0,0,w*0.32,0,7); c.stroke(); } },
  dryer:  { label:'Dryer', w:2.5, h:2.5, cat:'kitchen', ico:'◍', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.arc(0,0,w*0.32,0,7); c.stroke(); c.beginPath(); c.arc(0,0,w*0.12,0,7); c.stroke(); } },
  wh:     { label:'Water htr', w:2, h:2, cat:'other', ico:'◉', draw(c,w,h){ c.beginPath(); c.arc(0,0,Math.min(w,h)/2,0,7); c.stroke(); c.beginPath(); c.arc(0,0,3,0,7); c.stroke(); } },
  furnace:{ label:'Furnace', w:2.5, h:2.5, cat:'other', ico:'▩', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.font='7px sans-serif'; c.textAlign='center'; c.fillText('HVAC',0,3); } },
  stairs: { label:'Stairs', w:3, h:9, cat:'other', ico:'≣', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); const n=8; for(let i=1;i<n;i++){ const y=-h/2+i*h/n; c.beginPath(); c.moveTo(-w/2,y); c.lineTo(w/2,y); c.stroke(); } c.beginPath(); c.moveTo(0,-h/2+4); c.lineTo(0,h/2-4); c.stroke(); c.beginPath(); c.moveTo(-3,-h/2+9); c.lineTo(0,-h/2+4); c.lineTo(3,-h/2+9); c.stroke(); } },
  bed:    { label:'Bed', w:5, h:6.7, cat:'other', ico:'🛏', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,3); c.stroke(); c.beginPath(); c.moveTo(-w/2,-h/2+h*0.28); c.lineTo(w/2,-h/2+h*0.28); c.stroke(); rr(c,-w/2+4,-h/2+4,w/2-6,h*0.28-8,2); c.stroke(); rr(c,3,-h/2+4,w/2-6,h*0.28-8,2); c.stroke(); } },
  sofa:   { label:'Sofa', w:6.5, h:3, cat:'other', ico:'🛋', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,4); c.stroke(); c.beginPath(); c.moveTo(-w/2,-h/2+6); c.lineTo(w/2,-h/2+6); c.stroke(); } },
  table:  { label:'Table', w:4, h:3, cat:'other', ico:'▱', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,3); c.stroke(); } },
  car:    { label:'Car', w:6.5, h:15, cat:'other', ico:'🚗', draw(c,w,h){
              rr(c,-w/2,-h/2,w,h,w*0.32); c.stroke();                         // body
              rr(c,-w*0.42,-h*0.16,w*0.84,h*0.44,w*0.16); c.stroke();          // cabin/roof
              c.beginPath(); c.moveTo(-w*0.42,-h*0.16); c.lineTo(-w*0.30,-h*0.30); c.lineTo(w*0.30,-h*0.30); c.lineTo(w*0.42,-h*0.16); c.stroke(); // windshield
              c.beginPath(); c.moveTo(-w*0.42,h*0.28); c.lineTo(-w*0.30,h*0.40); c.lineTo(w*0.30,h*0.40); c.lineTo(w*0.42,h*0.28); c.stroke();   // rear window
              c.beginPath(); c.moveTo(0,-h*0.14); c.lineTo(0,h*0.26); c.stroke();  // console line
              c.beginPath(); c.arc(-w*0.26,-h*0.44,w*0.08,0,7); c.stroke(); c.beginPath(); c.arc(w*0.26,-h*0.44,w*0.08,0,7); c.stroke(); // headlights
              c.beginPath(); c.moveTo(-w/2,-h*0.12); c.lineTo(-w/2-w*0.13,-h*0.12); c.moveTo(w/2,-h*0.12); c.lineTo(w/2+w*0.13,-h*0.12); c.stroke(); // mirrors
            } },
  dresser:{ label:'Dresser', w:5, h:1.7, cat:'other', ico:'▤', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.moveTo(0,-h/2); c.lineTo(0,h/2); c.moveTo(-w/2,0); c.lineTo(w/2,0); c.stroke(); [[-w/4,-h/4],[w/4,-h/4],[-w/4,h/4],[w/4,h/4]].forEach(p=>{ c.beginPath(); c.arc(p[0],p[1],0.8,0,7); c.stroke(); }); } },
  nstand: { label:'Side table', w:1.7, h:1.7, cat:'other', ico:'▫', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.arc(0,0,Math.min(w,h)*0.18,0,7); c.stroke(); } },
  chair:  { label:'Chair', w:1.6, h:1.7, cat:'other', ico:'🪑', draw(c,w,h){ rr(c,-w/2,-h/2+2,w,h-2,2); c.stroke(); c.beginPath(); c.moveTo(-w/2,-h/2+2); c.lineTo(w/2,-h/2+2); c.stroke(); } },
  armchair:{ label:'Armchair', w:2.8, h:2.8, cat:'other', ico:'🛋', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,4); c.stroke(); rr(c,-w/2+4,-h/2+5,w-8,h-8,3); c.stroke(); } },
  desk:   { label:'Desk', w:4, h:2, cat:'other', ico:'▭', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,2); c.stroke(); c.beginPath(); c.moveTo(w/2-w*0.32,-h/2); c.lineTo(w/2-w*0.32,h/2); c.stroke(); } },
  bookshelf:{ label:'Bookshelf', w:3, h:1, cat:'other', ico:'▥', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); for(let i=1;i<3;i++){ const x=-w/2+i*w/3; c.beginPath(); c.moveTo(x,-h/2); c.lineTo(x,h/2); c.stroke(); } } },
  coffee: { label:'Coffee table', w:3.5, h:1.8, cat:'other', ico:'▱', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,4); c.stroke(); } },
  tv:     { label:'TV / media', w:5, h:1.3, cat:'other', ico:'▭', draw(c,w,h){ c.strokeRect(-w/2,-h/2,w,h); c.beginPath(); c.moveTo(-w*0.32,-h/2); c.lineTo(-w*0.32,-h/2-1.2); c.lineTo(w*0.32,-h/2-1.2); c.lineTo(w*0.32,-h/2); c.stroke(); } },
  bench:  { label:'Bench', w:4, h:1.3, cat:'other', ico:'▬', draw(c,w,h){ rr(c,-w/2,-h/2,w,h,2); c.stroke(); } },
  desk_chair:{ label:'Desk chair', w:1.8, h:1.8, cat:'other', ico:'○', draw(c,w,h){ c.beginPath(); c.arc(0,0.3,Math.min(w,h)*0.36,0,7); c.stroke(); c.beginPath(); c.arc(0,-h/2+3,Math.min(w,h)*0.4,Math.PI,0); c.stroke(); } },
  plant:  { label:'Plant', w:1.4, h:1.4, cat:'other', ico:'🪴', draw(c,w,h){ c.beginPath(); c.arc(0,0,Math.min(w,h)*0.42,0,7); c.stroke(); c.beginPath(); c.arc(0,0,Math.min(w,h)*0.2,0,7); c.stroke(); } },
  rug:    { label:'Rug', w:6, h:4, cat:'other', ico:'▦', dashed:true, draw(c,w,h){ c.save(); c.setLineDash([5,3]); c.strokeRect(-w/2,-h/2,w,h); c.restore(); } }
};
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

// ---------- Model ----------
let doc = { walls:[], items:[] };
let name='', client='';
let zoom = 16;          // pixels per foot
let panX = -2, panY = -2; // world (feet) coordinate shown at canvas top-left
let tool = 'select';
let wallHeight = 8;      // default height (ft) applied to new walls — used for wall-face area
let wallStud = '2x4';    // default framing for new walls (sets wall thickness)
const STUD = { '2x4': 3.5/12, '2x6': 5.5/12, '2x8': 7.25/12 }; // actual wall thickness in feet
function wallThick(wl){ return STUD[wl && wl.stud] || STUD['2x4']; }
let companyProfile = {}; // logo + contact info for the printed title block
let logoImg = null;
let placeType = null;    // a FIX key when a palette item is armed
let sel = null;          // {kind:'item'|'wall', i, ...}
let drawPts = null;      // in-progress wall chain [{x,y},...]
let cursor = null;       // world pos of cursor
const canvas = document.getElementById('fp-canvas');
const wrap = document.getElementById('canvas-wrap');
const ctx = canvas.getContext('2d');
let DPR = window.devicePixelRatio||1;

function W2S(p){ return { x:(p.x-panX)*zoom, y:(p.y-panY)*zoom }; }
function S2W(x,y){ return { x:x/zoom+panX, y:y/zoom+panY }; }
function snap(v){ return Math.round(v*2)/2; } // 6-inch grid
function snapPt(p){ return { x:snap(p.x), y:snap(p.y) }; }
let shiftHeld = false;   // hold Shift while drawing = freehand (no grid snap)
// Snap to the 6-inch grid by default; hold Shift to place freely (rounded to ~1 inch so numbers stay sane).
function snapMaybe(p){ return shiftHeld ? { x:Math.round(p.x*12)/12, y:Math.round(p.y*12)/12 } : snapPt(p); }
function ftIn(f){ const s=f<0?'-':''; f=Math.abs(f); let ft=Math.floor(f+1e-6); let inch=Math.round((f-ft)*12); if(inch===12){ft++;inch=0;} return s+ft+"'"+(inch?(' '+inch+'"'):''); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }

function resize(){ DPR=window.devicePixelRatio||1; const r=wrap.getBoundingClientRect(); canvas.width=r.width*DPR; canvas.height=r.height*DPR; canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px'; draw(); }
window.addEventListener('resize', resize);

// ---------- Drawing ----------
function draw(){
  const w=canvas.width, h=canvas.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,w,h);
  const vw=w/DPR, vh=h/DPR;
  // grid
  const w0=S2W(0,0), w1=S2W(vw,vh);
  ctx.lineWidth=1;
  for(let gx=Math.floor(w0.x); gx<=Math.ceil(w1.x); gx++){ const s=W2S({x:gx,y:0}); ctx.strokeStyle = gx%5===0 ? '#dcd6c4' : '#ece7d8'; ctx.beginPath(); ctx.moveTo(s.x,0); ctx.lineTo(s.x,vh); ctx.stroke(); }
  for(let gy=Math.floor(w0.y); gy<=Math.ceil(w1.y); gy++){ const s=W2S({x:0,y:gy}); ctx.strokeStyle = gy%5===0 ? '#dcd6c4' : '#ece7d8'; ctx.beginPath(); ctx.moveTo(0,s.y); ctx.lineTo(vw,s.y); ctx.stroke(); }

  // items first (so walls sit on top of room fills)
  doc.items.forEach((it,i)=> drawItem(it, sel&&sel.kind==='item'&&sel.i===i));
  // walls
  doc.walls.forEach((wl,i)=> drawWall(wl, sel&&sel.kind==='wall'&&sel.i===i));
  // in-progress wall
  if(drawPts && drawPts.length){
    ctx.strokeStyle='#2F6DB0'; ctx.strokeStyle='#2F6DB0'; ctx.lineWidth=Math.max(2,0.42*zoom);
    ctx.lineCap='round'; ctx.beginPath();
    const p0=W2S(drawPts[0]); ctx.moveTo(p0.x,p0.y);
    for(let k=1;k<drawPts.length;k++){ const p=W2S(drawPts[k]); ctx.lineTo(p.x,p.y); }
    const tip = cursor ? snapMaybe(cursor) : null;
    if(tip){ const c=W2S(tip); ctx.lineTo(c.x,c.y); }
    ctx.stroke(); ctx.lineCap='butt';
    // live length AND wall-face area of the current segment (area = length × wall height)
    const last=drawPts[drawPts.length-1];
    if(tip){ const len=dist(last.x,last.y,tip.x,tip.y); const mid=W2S({x:(last.x+tip.x)/2,y:(last.y+tip.y)/2}); label(ctx, ftIn(len)+'  ·  '+Math.round(len*wallHeight)+' sf', mid.x, mid.y-6); }
  }
  if(cursor && (tool==='wall'||tool==='line'||tool==='room'||placeType)){ const c=W2S(snapMaybe(cursor)); ctx.fillStyle='#2F6DB0'; ctx.beginPath(); ctx.arc(c.x,c.y,3.5,0,7); ctx.fill(); }
  // room drag preview
  if(roomDrag){ const a=W2S(roomDrag.a), b=W2S(snapMaybe(cursor)); ctx.strokeStyle='#1B4B7A'; ctx.setLineDash([5,4]); ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y)); ctx.setLineDash([]); }
  updateTotals();
}
function updateTotals(){ const el=document.getElementById('fp-totals'); if(!el) return;
  const fa=doc.items.filter(i=>i.type==='room').reduce((s,i)=>s+i.w*i.h,0);
  const groups={}; let wallTotal=0;
  doc.walls.forEach(w=>{ if(w.kind==='line') return; const area=dist(w.x1,w.y1,w.x2,w.y2)*(w.height||8); wallTotal+=area; const nm=(w.name&&w.name.trim())||'Unnamed'; groups[nm]=(groups[nm]||0)+area; });
  if(!fa && !wallTotal){ el.className='fp-totals'; return; }
  const r=n=>Math.round(n).toLocaleString();
  let html='';
  if(fa) html+='Floor area <b>'+r(fa)+'</b> sq ft';
  if(wallTotal){
    html+='<div style="margin-top:6px;color:#98a2ad;font-size:9px;letter-spacing:.06em;font-weight:600">WALL FACE (SQ FT)</div>';
    Object.keys(groups).sort().forEach(nm=>{ html+='<div>'+escapeHtmlT(nm)+' <b>'+r(groups[nm])+'</b></div>'; });
    if(Object.keys(groups).length>1) html+='<div style="border-top:1px solid var(--paper-line);margin-top:3px;padding-top:3px">Total <b>'+r(wallTotal)+'</b></div>';
  }
  el.className='fp-totals show'; el.innerHTML=html;
}
function escapeHtmlT(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function label(c,txt,x,y){ c.font='600 11px "IBM Plex Mono", monospace'; c.textAlign='center'; c.textBaseline='middle'; const wpx=c.measureText(txt).width+8; c.fillStyle='#fff'; c.fillRect(x-wpx/2,y-8,wpx,16); c.fillStyle='#17293D'; c.fillText(txt,x,y); }
// Draw a wall as a hollow rectangle: white (empty) body, only the edges (wall faces) inked —
// thickness comes from the framing (2x4 / 2x6 / 2x8). Returns the screen endpoints.
function wallShape(c, wl, color){
  const a=W2S({x:wl.x1,y:wl.y1}), b=W2S({x:wl.x2,y:wl.y2});
  const t=Math.max(2, wallThick(wl)*zoom);            // thickness in px
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, nx=-dy/L*(t/2), ny=dx/L*(t/2);
  c.beginPath(); c.moveTo(a.x+nx,a.y+ny); c.lineTo(b.x+nx,b.y+ny); c.lineTo(b.x-nx,b.y-ny); c.lineTo(a.x-nx,a.y-ny); c.closePath();
  c.fillStyle='#fff'; c.fill();
  c.strokeStyle=color; c.lineWidth=Math.max(1.4, zoom*0.05); c.lineJoin='miter'; c.stroke();
  return {a,b};
}
function drawWall(wl, selected){
  let a,b;
  if(wl.kind==='line'){
    // A plain line (e.g. concrete edge, saw-cut) — single stroke, no thickness or wall area.
    a=W2S({x:wl.x1,y:wl.y1}); b=W2S({x:wl.x2,y:wl.y2});
    ctx.strokeStyle=selected?'#2F6DB0':'#243B53'; ctx.lineWidth=Math.max(1.6, zoom*0.06);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  } else {
    ({a,b}=wallShape(ctx, wl, selected ? '#2F6DB0' : '#243B53'));
  }
  const len=dist(wl.x1,wl.y1,wl.x2,wl.y2);
  const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if(len>0.5) label(ctx, ftIn(len), mid.x, mid.y - (Math.abs(a.y-b.y)>Math.abs(a.x-b.x)?0:12));
  if(selected){ [a,b].forEach(p=>{ ctx.fillStyle='#fff'; ctx.strokeStyle='#2F6DB0'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); ctx.stroke(); }); }
}
function drawItem(it, selected){
  const c=W2S({x:it.x,y:it.y});
  const wpx=it.w*zoom, hpx=it.h*zoom;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate((it.rot||0)*Math.PI/180);
  if(it.type==='room'){
    ctx.fillStyle='rgba(111,195,228,.10)'; ctx.fillRect(-wpx/2,-hpx/2,wpx,hpx);
    ctx.strokeStyle=selected?'#2F6DB0':'#3E7A96'; ctx.lineWidth=1.5; ctx.strokeRect(-wpx/2,-hpx/2,wpx,hpx);
    ctx.fillStyle='#17293D'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='600 13px Oswald, sans-serif'; ctx.fillText(it.label||'Room',0,-6);
    ctx.font='11px "IBM Plex Mono", monospace'; ctx.fillStyle='#3E7A96'; ctx.fillText((it.w*it.h).toFixed(0)+' sq ft',0,10);
  } else if(it.type==='text'){
    ctx.fillStyle=selected?'#2F6DB0':'#17293D'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='600 14px Oswald, sans-serif'; ctx.fillText(it.label||'Text',0,0);
  } else {
    const f=FIX[it.type];
    ctx.strokeStyle=selected?'#2F6DB0':'#243B53'; ctx.fillStyle='#243B53'; ctx.lineWidth=1.6;
    ctx.save(); if(it.flip) ctx.scale(-1,1); if(f) f.draw(ctx, wpx, hpx); else { ctx.strokeRect(-wpx/2,-hpx/2,wpx,hpx); } ctx.restore();
    if(it.label){ ctx.fillStyle=selected?'#2F6DB0':'#5b6b7b'; ctx.font='10px "IBM Plex Sans"'; ctx.textAlign='center'; ctx.fillText(it.label,0,hpx/2+9); }
  }
  ctx.restore();
  if(selected){ drawHandles(it, c, wpx, hpx); }
}
function handlePts(it){ // returns screen points for resize(br) + rotate handles
  const c=W2S({x:it.x,y:it.y}); const wpx=it.w*zoom, hpx=it.h*zoom; const a=(it.rot||0)*Math.PI/180;
  const rot=(lx,ly)=>({x:c.x+lx*Math.cos(a)-ly*Math.sin(a), y:c.y+lx*Math.sin(a)+ly*Math.cos(a)});
  return { br:rot(wpx/2,hpx/2), rotH:rot(0,-hpx/2-22), tl:rot(-wpx/2,-hpx/2) };
}
function drawHandles(it,c,wpx,hpx){
  const hp=handlePts(it);
  if(it.type!=='text'){
    ctx.strokeStyle='#2F6DB0'; ctx.fillStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.rect(hp.br.x-4,hp.br.y-4,8,8); ctx.fill(); ctx.stroke();
    if(it.type!=='room'){ ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(hp.rotH.x,hp.rotH.y); ctx.stroke(); ctx.beginPath(); ctx.arc(hp.rotH.x,hp.rotH.y,5,0,7); ctx.fill(); ctx.stroke(); }
  }
}

// ---------- Hit testing ----------
function hitItem(wx,wy){
  for(let i=doc.items.length-1;i>=0;i--){ const it=doc.items[i];
    const a=-(it.rot||0)*Math.PI/180; const dx=wx-it.x, dy=wy-it.y;
    const lx=dx*Math.cos(a)-dy*Math.sin(a), ly=dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(lx)<=it.w/2+0.25 && Math.abs(ly)<=it.h/2+0.25) return i;
  }
  return -1;
}
function hitWall(wx,wy){
  const tol=0.5;
  for(let i=doc.walls.length-1;i>=0;i--){ const w=doc.walls[i];
    if(segDist(wx,wy,w.x1,w.y1,w.x2,w.y2)<tol) return i;
  }
  return -1;
}
function segDist(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1; const l2=dx*dx+dy*dy; if(l2===0) return dist(px,py,x1,y1); let t=((px-x1)*dx+(py-y1)*dy)/l2; t=Math.max(0,Math.min(1,t)); return dist(px,py,x1+t*dx,y1+t*dy); }
function nearScreen(sx,sy,pt){ return dist(sx,sy,pt.x,pt.y)<9; }

// ---------- Pointer interaction ----------
let drag=null, roomDrag=null;
function evPos(e){ const r=canvas.getBoundingClientRect(); return { sx:e.clientX-r.left, sy:e.clientY-r.top }; }
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  showTip('');
  shiftHeld=e.shiftKey;
  const {sx,sy}=evPos(e); const wpt=S2W(sx,sy); cursor=wpt;
  if(placeType){ placeFixture(placeType, snapMaybe(wpt)); return; }
  if(tool==='wall'||tool==='line'){ addWallPoint(snapMaybe(wpt)); return; }
  if(tool==='room'){ roomDrag={a:snapMaybe(wpt)}; return; }
  if(tool==='text'){ const t=prompt('Label text:'); if(t){ doc.items.push({type:'text',x:snap(wpt.x),y:snap(wpt.y),w:2,h:0.6,rot:0,label:t}); markDirty(); } setTool('select'); draw(); return; }
  // select tool
  if(sel && sel.kind==='item'){ const it=doc.items[sel.i]; const hp=handlePts(it);
    if(it.type!=='text' && nearScreen(sx,sy,hp.br)){ drag={mode:'resize', start:wpt, w0:it.w, h0:it.h}; return; }
    if(it.type!=='text' && it.type!=='room' && nearScreen(sx,sy,hp.rotH)){ drag={mode:'rotate'}; return; }
  }
  if(sel && sel.kind==='wall'){ const w=doc.walls[sel.i]; const a=W2S({x:w.x1,y:w.y1}), b=W2S({x:w.x2,y:w.y2});
    if(nearScreen(sx,sy,a)){ drag={mode:'wallpt', end:1}; return; }
    if(nearScreen(sx,sy,b)){ drag={mode:'wallpt', end:2}; return; }
  }
  const ii=hitItem(wpt.x,wpt.y);
  if(ii>=0){ sel={kind:'item',i:ii}; drag={mode:'move', start:wpt, ox:doc.items[ii].x, oy:doc.items[ii].y}; showProps(); draw(); return; }
  const wi=hitWall(wpt.x,wpt.y);
  if(wi>=0){ sel={kind:'wall',i:wi}; const w=doc.walls[wi]; drag={mode:'wallmove', start:wpt, o:{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2}}; showProps(); draw(); return; }
  // empty: pan
  sel=null; showProps(); drag={mode:'pan', start:{sx,sy}, p0:{panX,panY}}; draw();
});
canvas.addEventListener('pointermove', e=>{
  shiftHeld=e.shiftKey;
  const {sx,sy}=evPos(e); const wpt=S2W(sx,sy); cursor=wpt;
  if(drag){
    if(drag.mode==='pan'){ panX=drag.p0.panX-(sx-drag.start.sx)/zoom; panY=drag.p0.panY-(sy-drag.start.sy)/zoom; draw(); return; }
    if(drag.mode==='move'){ const it=doc.items[sel.i]; it.x=snap(drag.ox+(wpt.x-drag.start.x)); it.y=snap(drag.oy+(wpt.y-drag.start.y)); draw(); return; }
    if(drag.mode==='resize'){ const it=doc.items[sel.i]; const a=-(it.rot||0)*Math.PI/180; const dx=wpt.x-it.x, dy=wpt.y-it.y; const lx=Math.abs(dx*Math.cos(a)-dy*Math.sin(a))*2, ly=Math.abs(dx*Math.sin(a)+dy*Math.cos(a))*2; it.w=Math.max(0.5,snap(lx)); it.h=Math.max(0.5,snap(ly)); draw(); showProps(); return; }
    if(drag.mode==='rotate'){ const it=doc.items[sel.i]; let ang=Math.atan2(wpt.y-it.y, wpt.x-it.x)*180/Math.PI+90; if(!e.shiftKey) ang=Math.round(ang/15)*15; it.rot=((ang%360)+360)%360; draw(); return; }
    if(drag.mode==='wallpt'){ const w=doc.walls[sel.i]; const p=snapPt(wpt); if(drag.end===1){ w.x1=p.x; w.y1=p.y; } else { w.x2=p.x; w.y2=p.y; } draw(); return; }
    if(drag.mode==='wallmove'){ const w=doc.walls[sel.i]; const ddx=snap(wpt.x-drag.start.x), ddy=snap(wpt.y-drag.start.y); w.x1=drag.o.x1+ddx; w.y1=drag.o.y1+ddy; w.x2=drag.o.x2+ddx; w.y2=drag.o.y2+ddy; draw(); return; }
  }
  // hover tooltips over the selection handles (only in select mode, when not dragging)
  if(tool==='select' && sel && !drag){
    let tip='', cur='';
    if(sel.kind==='item'){ const it=doc.items[sel.i]; const hp=handlePts(it);
      if(it.type!=='text' && nearScreen(sx,sy,hp.br)){ tip = it.type==='room' ? 'Drag to resize the room (updates its square footage)' : 'Drag to resize'; cur='nwse-resize'; }
      else if(it.type!=='text' && it.type!=='room' && nearScreen(sx,sy,hp.rotH)){ tip='Drag to rotate (hold Shift for any angle)'; cur='grab'; }
    } else if(sel.kind==='wall'){ const w=doc.walls[sel.i]; const a=W2S({x:w.x1,y:w.y1}), b=W2S({x:w.x2,y:w.y2});
      if(nearScreen(sx,sy,a)||nearScreen(sx,sy,b)){ tip='Drag to move this wall end'; cur='move'; }
    }
    showTip(tip, sx, sy); canvas.style.cursor = cur;
  } else if(!drag){ showTip(''); if(tool==='select') canvas.style.cursor=''; }
  if(drawPts || roomDrag || placeType || tool==='wall' || tool==='line' || tool==='room') draw();
});
function showTip(txt,sx,sy){ const t=document.getElementById('fp-tip'); if(!txt){ t.className='fp-tip'; return; } t.textContent=txt; t.className='fp-tip show'; t.style.left=(sx+16)+'px'; t.style.top=sy+'px'; }
canvas.addEventListener('pointerleave', ()=> showTip(''));
canvas.addEventListener('pointerup', e=>{
  if(drag){ if(['move','resize','rotate','wallpt','wallmove'].includes(drag.mode)) markDirty();
    if(drag.mode==='pan'){} drag=null; }
  if(roomDrag){ const pos=evPos(e); shiftHeld=e.shiftKey; const a=roomDrag.a, b=snapMaybe(S2W(pos.sx,pos.sy)); const x=(a.x+b.x)/2, y=(a.y+b.y)/2, w=Math.abs(b.x-a.x), h=Math.abs(b.y-a.y); roomDrag=null;
    if(w>=1 && h>=1){ const nm=prompt('Room name:','Room')||'Room'; doc.items.push({type:'room',x,y,w,h,rot:0,label:nm}); sel={kind:'item',i:doc.items.length-1}; markDirty(); showProps(); } setTool('select'); draw(); }
});
canvas.addEventListener('dblclick', ()=>{ if(drawPts){ finishWall(); } });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const {sx,sy}=evPos(e); const before=S2W(sx,sy); zoom*=(e.deltaY<0?1.12:0.89); zoom=Math.max(4,Math.min(80,zoom)); const after=S2W(sx,sy); panX+=before.x-after.x; panY+=before.y-after.y; draw(); }, {passive:false});

function addWallPoint(p){ if(!drawPts){ drawPts=[p]; } else { const last=drawPts[drawPts.length-1];
    const seg = tool==='line' ? {x1:last.x,y1:last.y,x2:p.x,y2:p.y,kind:'line',name:''}
                              : {x1:last.x,y1:last.y,x2:p.x,y2:p.y,height:wallHeight,stud:wallStud,name:''};
    doc.walls.push(seg); drawPts.push(p); markDirty(); } draw(); }
document.getElementById('wall-h').addEventListener('change',e=>{ const v=parseFloat(e.target.value); if(v>0) wallHeight=v; });
document.getElementById('wall-stud').addEventListener('change',e=>{ wallStud=e.target.value; });
function finishWall(){ drawPts=null; draw(); }
function placeFixture(type, p){ const f=FIX[type]; doc.items.push({type, x:p.x, y:p.y, w:f.w, h:f.h, rot:0, label:''}); sel={kind:'item',i:doc.items.length-1}; markDirty(); setTool('select'); showProps(); draw(); }

// ---------- Tools / palette ----------
function setTool(t){ tool=t; placeType=null; if(t!=='select'){ sel=null; showProps(); } drawPts=null; roomDrag=null;
  document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector('.tool[data-tool="'+t+'"]'); if(btn) btn.classList.add('active');
  wrap.classList.toggle('select', t==='select');
  setHint(); draw();
}
function armFixture(type, btn){ tool='place'; placeType=type; sel=null; showProps(); drawPts=null;
  document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active');
  wrap.classList.remove('select'); setHint(); draw();
}
document.querySelectorAll('.tool[data-tool]').forEach(b=> b.addEventListener('click', ()=> setTool(b.getAttribute('data-tool'))) );
function buildPalette(){ const groups={openings:'pal-openings',bath:'pal-bath',kitchen:'pal-kitchen',other:'pal-other'};
  Object.keys(FIX).forEach(key=>{ const f=FIX[key]; const g=document.getElementById(groups[f.cat]); if(!g) return;
    const b=document.createElement('button'); b.className='tool'; b.innerHTML='<span class="ico">'+f.ico+'</span>'+f.label; b.addEventListener('click',()=>armFixture(key,b)); g.appendChild(b); });
}
function setHint(){ const h=document.getElementById('hint');
  const m = placeType ? 'Click to drop the '+FIX[placeType].label.toLowerCase()+'. Then use Select to move, resize (corner), or rotate (top dot).'
    : tool==='wall' ? 'Click to drop wall corners — snaps to a 6-inch grid; hold Shift to draw freehand. Each segment shows its length + wall area. Double-click or Esc to finish.'
    : tool==='line' ? 'Click to drop points for a plain line (e.g. concrete edge, saw-cut) — snaps to the grid; hold Shift for freehand. Each segment shows its length. Double-click or Esc to finish.'
    : tool==='room' ? 'Drag a box for the room; you’ll name it and it shows square footage.'
    : tool==='text' ? 'Click where you want a label.'
    : 'Drag empty space to pan · scroll to zoom · click an item to select · Delete to remove.';
  h.textContent=m;
}

// ---------- Properties panel ----------
function showProps(){ const el=document.getElementById('props');
  if(!sel){ el.className='fp-props'; el.innerHTML=''; return; }
  el.className='fp-props show';
  if(sel.kind==='wall' && doc.walls[sel.i] && doc.walls[sel.i].kind==='line'){
    const w=doc.walls[sel.i]; const L=dist(w.x1,w.y1,w.x2,w.y2);
    el.innerHTML='<div style="font-weight:600;color:var(--heading)">Line</div>'
      +'<label>Label</label><input id="pp-lname" value="'+escAttr(w.name||'')+'" placeholder="e.g. Concrete edge">'
      +'<label>Length (ft)</label><input id="pp-llen" value="'+ftFeetStr(L)+'">'
      +'<div class="meta">'+ftIn(L)+'</div>'
      +'<div class="row"><button class="btn" id="pp-del">Delete</button></div>';
    document.getElementById('pp-lname').addEventListener('input',ev=>{ w.name=ev.target.value; markDirty(); draw(); });
    document.getElementById('pp-llen').addEventListener('change',ev=>{ const nf=parseFloat(ev.target.value); if(nf>0){ const cur=dist(w.x1,w.y1,w.x2,w.y2)||1; const ux=(w.x2-w.x1)/cur, uy=(w.y2-w.y1)/cur; w.x2=snap(w.x1+ux*nf); w.y2=snap(w.y1+uy*nf); markDirty(); draw(); showProps(); } });
    document.getElementById('pp-del').addEventListener('click',deleteSel);
  } else if(sel.kind==='wall'){ const w=doc.walls[sel.i]; if(w.height==null) w.height=8; if(!w.stud) w.stud='2x4'; const L=dist(w.x1,w.y1,w.x2,w.y2);
    const names=[...new Set(doc.walls.map(x=>x.name).filter(n=>n&&n.trim()))];
    const opt=s=>'<option'+(w.stud===s?' selected':'')+'>'+s+'</option>';
    el.innerHTML='<div style="font-weight:600;color:var(--heading)">Wall</div>'
      +'<label>Name / type</label><input id="pp-name" list="pp-names" value="'+escAttr(w.name||'')+'" placeholder="e.g. Exterior, Garage">'
      +'<datalist id="pp-names">'+names.map(n=>'<option value="'+escAttr(n)+'">').join('')+'</datalist>'
      +'<label>Framing</label><select id="pp-stud">'+opt('2x4')+opt('2x6')+opt('2x8')+'</select>'
      +'<label>Length (ft)</label><input id="pp-len" value="'+ftFeetStr(L)+'">'
      +'<label>Height (ft)</label><input id="pp-ht" value="'+w.height+'">'
      +'<div class="meta">Wall face: <b id="pp-face">'+(L*w.height).toFixed(0)+'</b> sq ft &nbsp;('+ftIn(L)+' × '+w.height+' ft)</div>'
      +'<div class="row"><button class="btn" id="pp-del">Delete</button></div>';
    document.getElementById('pp-name').addEventListener('input',ev=>{ w.name=ev.target.value; markDirty(); draw(); });
    document.getElementById('pp-stud').addEventListener('change',ev=>{ w.stud=ev.target.value; markDirty(); draw(); });
    document.getElementById('pp-len').addEventListener('change',ev=>{ const nf=parseFloat(ev.target.value); if(nf>0){ const cur=dist(w.x1,w.y1,w.x2,w.y2)||1; const ux=(w.x2-w.x1)/cur, uy=(w.y2-w.y1)/cur; w.x2=snap(w.x1+ux*nf); w.y2=snap(w.y1+uy*nf); markDirty(); draw(); showProps(); } });
    document.getElementById('pp-ht').addEventListener('change',ev=>{ const h=parseFloat(ev.target.value); if(h>0){ w.height=h; markDirty(); draw(); showProps(); } });
  } else { const it=doc.items[sel.i];
    let html='<div style="font-weight:600;color:var(--heading)">'+(it.type==='room'?'Room':it.type==='text'?'Label':(FIX[it.type]?FIX[it.type].label:'Item'))+'</div>';
    html+='<label>Label</label><input id="pp-label" value="'+escAttr(it.label||'')+'">';
    if(it.type!=='text'){ html+='<label>Width / Depth (ft)</label><div class="row"><input id="pp-w" value="'+it.w+'"><input id="pp-h" value="'+it.h+'"></div>'; }
    if(it.type==='room'){ html+='<div class="meta">Area: '+(it.w*it.h).toFixed(0)+' sq ft</div>'; }
    const isFix = it.type!=='text' && it.type!=='room';
    html+='<div class="row">'+(isFix?'<button class="btn" id="pp-rot">Rotate 90°</button><button class="btn" id="pp-flip">Flip ⇋</button>':'')+'</div>';
    html+='<div class="row"><button class="btn" id="pp-del">Delete</button></div>';
    el.innerHTML=html;
    document.getElementById('pp-label').addEventListener('input',ev=>{ it.label=ev.target.value; markDirty(); draw(); });
    if(document.getElementById('pp-w')){ document.getElementById('pp-w').addEventListener('change',ev=>{ it.w=Math.max(0.5,parseFloat(ev.target.value)||it.w); markDirty(); draw(); showProps(); }); document.getElementById('pp-h').addEventListener('change',ev=>{ it.h=Math.max(0.5,parseFloat(ev.target.value)||it.h); markDirty(); draw(); showProps(); }); }
    if(document.getElementById('pp-rot')) document.getElementById('pp-rot').addEventListener('click',()=>{ it.rot=((it.rot||0)+90)%360; markDirty(); draw(); });
    if(document.getElementById('pp-flip')) document.getElementById('pp-flip').addEventListener('click',()=>{ it.flip=!it.flip; markDirty(); draw(); });
  }
  document.getElementById('pp-del').addEventListener('click',deleteSel);
}
function ftFeetStr(f){ return (Math.round(f*100)/100); }
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function deleteSel(){ if(!sel) return; if(sel.kind==='item') doc.items.splice(sel.i,1); else if(sel.kind==='wall') doc.walls.splice(sel.i,1); sel=null; showProps(); markDirty(); draw(); }

document.addEventListener('keyup', e=>{ if(e.key==='Shift'){ shiftHeld=false; if(drawPts||roomDrag) draw(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Shift'){ shiftHeld=true; if(drawPts||roomDrag) draw(); }
  if(/input|textarea/i.test((e.target.tagName||''))) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); }
  else if(e.key==='Escape'){ if(drawPts) finishWall(); else { setTool('select'); } }
  else if(e.key==='v') setTool('select');
  else if(e.key==='w') setTool('wall');
  else if(e.key==='r') setTool('room');
});

// ---------- Zoom buttons ----------
document.getElementById('z-in').onclick=()=>{ zoomAt(1.2); };
document.getElementById('z-out').onclick=()=>{ zoomAt(0.83); };
document.getElementById('z-fit').onclick=fitView;
function zoomAt(f){ const cx=canvas.width/DPR/2, cy=canvas.height/DPR/2; const before=S2W(cx,cy); zoom=Math.max(4,Math.min(80,zoom*f)); const after=S2W(cx,cy); panX+=before.x-after.x; panY+=before.y-after.y; draw(); }
function fitView(){ const pts=[]; doc.walls.forEach(w=>{pts.push({x:w.x1,y:w.y1},{x:w.x2,y:w.y2});}); doc.items.forEach(it=>{pts.push({x:it.x-it.w/2,y:it.y-it.h/2},{x:it.x+it.w/2,y:it.y+it.h/2});});
  if(!pts.length){ zoom=16; panX=-2; panY=-2; draw(); return; }
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity; pts.forEach(p=>{minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y);});
  const vw=canvas.width/DPR, vh=canvas.height/DPR; const pad=2; const zw=vw/((maxx-minx)+pad*2), zh=vh/((maxy-miny)+pad*2);
  zoom=Math.max(4,Math.min(60,Math.min(zw,zh))); panX=minx-pad; panY=miny-pad; draw();
}

// ---------- Save / load ----------
let dirty=false, saveTimer=null;
function markDirty(){ dirty=true; document.getElementById('save-state').textContent='Saving…'; clearTimeout(saveTimer); saveTimer=setTimeout(save, 800); }
async function save(){ try{ await apiFetch('/api/plans/'+planId, { method:'PUT', body: JSON.stringify({ name:name, client:client, doc:doc }) }); dirty=false; document.getElementById('save-state').textContent='Saved ✓'; }catch(err){ document.getElementById('save-state').textContent='Save failed'; } }

const nameInput=document.getElementById('plan-name'), clientInput=document.getElementById('plan-client');
nameInput.addEventListener('input',()=>{ name=nameInput.value; markDirty(); });
clientInput.addEventListener('input',()=>{ client=clientInput.value; markDirty(); });

// export — a full "sheet" with an architect-style title block (logo + project info) on the right.
document.getElementById('btn-png').onclick=async ()=>{ await loadLogo(); exportImage(); };
// Print: ask for orientation, then render a sheet sized to fill a full Letter page.
document.getElementById('btn-print').onclick=()=>{ document.getElementById('print-modal').classList.add('show'); };
document.getElementById('po-cancel').onclick=hideModal;
document.getElementById('print-modal').addEventListener('click', e=>{ if(e.target.id==='print-modal') hideModal(); });
document.getElementById('po-port').onclick=()=>doPrint('portrait');
document.getElementById('po-land').onclick=()=>doPrint('landscape');
function hideModal(){ document.getElementById('print-modal').classList.remove('show'); }
async function doPrint(orientation){ hideModal(); await loadLogo();
  const land = orientation==='landscape';
  const aspect = land ? (11/8.5) : (8.5/11);       // Letter page aspect (w/h)
  const url = renderSheet(land ? 2200 : 1700, aspect);
  const w = window.open('');
  w.document.write('<title>'+escAttr(name||'Floor Plan')+'</title>'
    +'<style>@page{size:Letter '+orientation+';margin:0} html,body{margin:0;height:100%} '
    +'img{width:100%;height:100%;object-fit:fill;display:block}</style>'
    +'<img src="'+url+'" onload="setTimeout(function(){print()},150)">');
  w.document.close();
}
function loadLogo(){ return new Promise(res=>{ const url=companyProfile.logo; if(!url){ logoImg=null; return res(); } if(logoImg && logoImg.src===url){ return res(); } const im=new Image(); im.onload=()=>{ logoImg=im; res(); }; im.onerror=()=>{ logoImg=null; res(); }; im.src=url; }); }
function planBounds(){ const pts=[]; doc.walls.forEach(w=>{pts.push({x:w.x1,y:w.y1},{x:w.x2,y:w.y2});}); doc.items.forEach(it=>{pts.push({x:it.x-it.w/2,y:it.y-it.h/2},{x:it.x+it.w/2,y:it.y+it.h/2});});
  let minx=0,miny=0,maxx=20,maxy=15; if(pts.length){ minx=Math.min(...pts.map(p=>p.x));miny=Math.min(...pts.map(p=>p.y));maxx=Math.max(...pts.map(p=>p.x));maxy=Math.max(...pts.map(p=>p.y)); } return {minx,miny,maxx,maxy}; }
function renderSheet(px, aspect){
  const k=px/1800;                         // scale factor for fonts/margins
  const margin=Math.round(28*k), tbW=Math.max(Math.round(230*k), Math.round(px*0.2)), gap=Math.round(24*k);
  const drawW=px - margin*2 - tbW - gap;   // width of the drawing column (title block sits to its right)
  const b=planBounds(); const padFt=1.5, fw=(b.maxx-b.minx)+padFt*2, fh=(b.maxy-b.miny)+padFt*2;
  // Sheet height: fixed to the page aspect when printing; otherwise sized to the plan.
  let sheetH;
  if(aspect){ sheetH=Math.round(px/aspect); }
  else { const z0=Math.max(2, drawW/fw); sheetH=Math.max(Math.round(fh*z0)+margin*2, Math.round(560*k)); }
  const availH=sheetH-margin*2;
  // Fit the plan inside the drawing column on both axes, then centre it (letterbox) so the page fills.
  const z=Math.max(2, Math.min(drawW/fw, availH/fh));
  const usedW=fw*z, usedH=fh*z;
  const planX=margin + Math.max(0,(drawW-usedW)/2), planY=margin + Math.max(0,(availH-usedH)/2);
  const oc=document.createElement('canvas'); oc.width=px; oc.height=sheetH; const c=oc.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,px,sheetH);
  // outer border (double line, like a drawing sheet)
  c.strokeStyle='#17293D'; c.lineWidth=2*k; c.strokeRect(margin*0.5,margin*0.5,px-margin,sheetH-margin);
  c.lineWidth=1*k; c.strokeRect(margin*0.5+4*k,margin*0.5+4*k,px-margin-8*k,sheetH-margin-8*k);
  const _z=zoom,_px=panX,_py=panY; zoom=z; panX=(b.minx-padFt) - planX/z; panY=(b.miny-padFt) - planY/z;
  c.save(); c.beginPath(); c.rect(planX,planY,usedW,usedH); c.clip();
  // faint scale grid
  for(let gx=Math.floor(b.minx-padFt); gx<=Math.ceil(b.maxx+padFt); gx++){ const s=W2S({x:gx,y:0}); c.strokeStyle=gx%5===0?'#e2ddcd':'#f0ecdf'; c.lineWidth=1; c.beginPath(); c.moveTo(s.x,planY); c.lineTo(s.x,planY+usedH); c.stroke(); }
  for(let gy=Math.floor(b.miny-padFt); gy<=Math.ceil(b.maxy+padFt); gy++){ const s=W2S({x:0,y:gy}); c.strokeStyle=gy%5===0?'#e2ddcd':'#f0ecdf'; c.lineWidth=1; c.beginPath(); c.moveTo(planX,s.y); c.lineTo(planX+usedW,s.y); c.stroke(); }
  doc.items.forEach(it=>drawItemOn(c,it)); doc.walls.forEach(w=>drawWallOn(c,w));
  drawScaleBar(c, planX+12*k, planY+usedH-16*k, z, k);
  c.restore();
  c.strokeStyle='#c9c2ae'; c.lineWidth=1*k; c.strokeRect(planX,planY,usedW,usedH);
  zoom=_z; panX=_px; panY=_py;
  drawTitleBlock(c, px-margin-tbW, margin, tbW, sheetH-margin*2, k);
  return oc.toDataURL('image/png');
}
function niceScaleFt(z, maxpx){ const cand=[1,2,5,10,20,50,100]; let best=1; cand.forEach(f=>{ if(f*z<=maxpx) best=f; }); return best; }
function drawScaleBar(c,x,y,z,k){ const ft=niceScaleFt(z, 260*k); const len=ft*z; c.strokeStyle='#17293D'; c.fillStyle='#17293D'; c.lineWidth=1.5*k;
  c.beginPath(); c.moveTo(x,y); c.lineTo(x+len,y); c.stroke();
  [0,len/2,len].forEach(dx=>{ c.beginPath(); c.moveTo(x+dx,y-4*k); c.lineTo(x+dx,y+4*k); c.stroke(); });
  c.font=(11*k)+'px "IBM Plex Mono", monospace'; c.textAlign='center'; c.textBaseline='top'; c.fillText('0',x,y+6*k); c.fillText(ft+" ft",x+len,y+6*k); }
function drawTitleBlock(c,x,y,w,h,k){
  c.strokeStyle='#17293D'; c.lineWidth=1.5*k; c.strokeRect(x,y,w,h);
  let ty=y; const pad=12*k; const line=(yy)=>{ c.strokeStyle='#c9c2ae'; c.lineWidth=1*k; c.beginPath(); c.moveTo(x,yy); c.lineTo(x+w,yy); c.stroke(); };
  // logo
  ty+=pad;
  if(logoImg){ const maxW=w-pad*2, maxH=72*k; const r=Math.min(maxW/logoImg.width, maxH/logoImg.height); const iw=logoImg.width*r, ih=logoImg.height*r; c.drawImage(logoImg, x+(w-iw)/2, ty, iw, ih); ty+=ih+pad; }
  // company block
  c.textAlign='center'; c.textBaseline='top';
  c.fillStyle='#17293D'; c.font='600 '+(17*k)+'px Oswald, sans-serif';
  const cName=companyProfile.name||''; if(cName){ c.fillText(cutText(c,cName,w-pad*2), x+w/2, ty); ty+=20*k; }
  c.fillStyle='#5b6b7b'; c.font=(11*k)+'px "IBM Plex Sans", sans-serif';
  [companyProfile.license?('Lic. '+companyProfile.license):'', companyProfile.address||'', companyProfile.phone||'', companyProfile.email||'', companyProfile.website||''].filter(Boolean).forEach(t=>{ c.fillText(cutText(c,t,w-pad*2), x+w/2, ty); ty+=15*k; });
  ty+=pad; line(ty); ty+=pad;
  // project fields (left-aligned label/value rows)
  c.textAlign='left';
  const field=(label,val)=>{ c.fillStyle='#98a2ad'; c.font='600 '+(9*k)+'px "IBM Plex Mono", monospace'; c.fillText(label.toUpperCase(), x+pad, ty); ty+=12*k;
    c.fillStyle='#17293D'; c.font='600 '+(13*k)+'px "IBM Plex Sans", sans-serif'; c.fillText(cutText(c,val||'—',w-pad*2), x+pad, ty); ty+=19*k; };
  field('Project', name||'Floor Plan');
  field('Client', client);
  field('Date', new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}));
  field('Scale', 'Drawn to scale (see bar)');
  ty+=2*k; line(ty); ty+=pad;
  // quantities
  const floorArea=doc.items.filter(i=>i.type==='room').reduce((s,i)=>s+i.w*i.h,0);
  const wallArea=doc.walls.reduce((s,wl)=>s+(wl.kind==='line'?0:dist(wl.x1,wl.y1,wl.x2,wl.y2)*(wl.height||8)),0);
  c.fillStyle='#98a2ad'; c.font='600 '+(9*k)+'px "IBM Plex Mono", monospace'; c.fillText('QUANTITIES', x+pad, ty); ty+=13*k;
  c.font=(12*k)+'px "IBM Plex Sans", sans-serif';
  const qty=(t)=>{ c.fillStyle='#243B53'; c.fillText(t, x+pad, ty); ty+=16*k; };
  if(floorArea>0) qty('Floor area:  '+Math.round(floorArea).toLocaleString()+' sq ft');
  if(wallArea>0)  qty('Wall face:   '+Math.round(wallArea).toLocaleString()+' sq ft');
  // footer pinned to bottom
  c.fillStyle='#98a2ad'; c.font=(9.5*k)+'px "IBM Plex Sans", sans-serif'; c.textAlign='center'; c.textBaseline='bottom';
  c.fillText('For planning only — not a stamped construction document.', x+w/2, y+h-18*k);
  c.fillStyle='#c9c2ae'; c.fillText('Prepared with Fieldscale', x+w/2, y+h-6*k);
}
function cutText(c,s,maxw){ s=String(s); if(c.measureText(s).width<=maxw) return s; while(s.length>1 && c.measureText(s+'…').width>maxw) s=s.slice(0,-1); return s+'…'; }
function drawWallOn(c,wl){
  let a,b;
  if(wl.kind==='line'){ a=W2S({x:wl.x1,y:wl.y1}); b=W2S({x:wl.x2,y:wl.y2}); c.strokeStyle='#243B53'; c.lineWidth=Math.max(1.6, zoom*0.06); c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
  else { ({a,b}=wallShape(c, wl, '#243B53')); }
  const len=dist(wl.x1,wl.y1,wl.x2,wl.y2); const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; if(len>0.5) labelOn(c,ftIn(len),mid.x,mid.y-8);
}
function drawItemOn(c,it){ const p=W2S({x:it.x,y:it.y}); const wpx=it.w*zoom,hpx=it.h*zoom; c.save(); c.translate(p.x,p.y); c.rotate((it.rot||0)*Math.PI/180);
  if(it.type==='room'){ c.fillStyle='rgba(111,195,228,.10)'; c.fillRect(-wpx/2,-hpx/2,wpx,hpx); c.strokeStyle='#3E7A96'; c.lineWidth=1.5; c.strokeRect(-wpx/2,-hpx/2,wpx,hpx); c.fillStyle='#17293D'; c.textAlign='center'; c.textBaseline='middle'; c.font='600 13px Oswald, sans-serif'; c.fillText(it.label||'Room',0,-6); c.font='11px monospace'; c.fillStyle='#3E7A96'; c.fillText((it.w*it.h).toFixed(0)+' sq ft',0,10); }
  else if(it.type==='text'){ c.fillStyle='#17293D'; c.textAlign='center'; c.textBaseline='middle'; c.font='600 14px Oswald, sans-serif'; c.fillText(it.label||'Text',0,0); }
  else { const f=FIX[it.type]; c.strokeStyle='#243B53'; c.fillStyle='#243B53'; c.lineWidth=1.6; c.save(); if(it.flip) c.scale(-1,1); if(f) f.draw(c,wpx,hpx); else c.strokeRect(-wpx/2,-hpx/2,wpx,hpx); c.restore(); if(it.label){ c.fillStyle='#5b6b7b'; c.font='10px sans-serif'; c.textAlign='center'; c.fillText(it.label,0,hpx/2+9); } }
  c.restore(); }
function labelOn(c,txt,x,y){ c.font='600 11px monospace'; c.textAlign='center'; c.textBaseline='middle'; const wpx=c.measureText(txt).width+8; c.fillStyle='#fff'; c.fillRect(x-wpx/2,y-8,wpx,16); c.fillStyle='#17293D'; c.fillText(txt,x,y); }
function exportImage(){ const url=renderSheet(1800); const a=document.createElement('a'); a.href=url; a.download=(name||'floor-plan').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png'; a.click(); }

async function init(){
  try{ const me=await apiFetch('/api/me'); document.getElementById('who').textContent=me.username; }catch(e){ return; }
  try{ const p=await apiFetch('/api/plans/'+planId); name=p.name||''; client=p.client||''; nameInput.value=name; clientInput.value=client; doc=Object.assign({walls:[],items:[]}, p.doc||{}); doc.walls=doc.walls||[]; doc.items=doc.items||[]; }
  catch(e){ alert('Could not load plan: '+e.message); location.href='/plans.html'; return; }
  try{ const co=await apiFetch('/api/company'); companyProfile=co.profile||{}; loadLogo(); }catch(e){}
  resize(); setTool('select'); if(doc.walls.length||doc.items.length) fitView(); document.getElementById('save-state').textContent='Saved ✓';
}
