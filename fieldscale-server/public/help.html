<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldscale — Help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fs-theme.css">
<style>
  .wrap{max-width:820px}
  .sub{color:var(--steel);margin:0 0 20px}
  .faq{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .faq > summary{cursor:pointer;padding:14px 16px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .faq > summary::-webkit-details-marker{display:none}
  .faq > summary::after{content:'＋';color:var(--steel);font-weight:400}
  .faq[open] > summary::after{content:'－'}
  .faq .body{padding:0 16px 14px;font-size:13.5px;line-height:1.6;color:var(--charcoal)}
  .faq .body a{color:var(--blueprint-2)}
  h2{font-family:'Oswald',sans-serif;font-size:16px;margin:26px 0 10px}
  .searchbox{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--steel-light);border-radius:var(--radius);font-size:14px;margin-bottom:18px}
</style>
<script src="/app-nav.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>FIELDSCALE</div>
  <nav></nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <a href="#" id="logout-link" style="color:var(--steel-light);font-size:13px;margin-left:14px;text-decoration:none">Log out</a>
</header>

<div class="wrap">
  <h1 style="font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;margin:0 0 4px">Help &amp; FAQ</h1>
  <p class="sub">Download a full guide, or search the quick answers below.</p>

  <h2 style="font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;margin:18px 0 4px">📘 User guides (PDF)</h2>
  <p class="sub" style="margin-top:0">Detailed, plain-language guides to each part of Fieldscale. Click to open or download.</p>
  <div id="guides" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:10px 0 26px"></div>

  <h2 style="font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;margin:0 0 8px">❓ Quick answers</h2>
  <input class="searchbox" id="q" placeholder="Search help… (e.g. estimate, invoice, employee)" />
  <div id="faqs"></div>
</div>

<script>
const TOKEN_STORAGE='fieldscale_token';
function getToken(){ return localStorage.getItem(TOKEN_STORAGE); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='logout-link'){ e.preventDefault(); localStorage.removeItem('fieldscale_token'); localStorage.removeItem('fieldscale_username'); location.href='/'; } });
async function apiFetch(path){ const t=getToken(); const res=await fetch(path,{headers:t?{'Authorization':'Bearer '+t}:{}}); if(res.status===401){ location.href='/'; throw new Error('x'); } return res.json(); }
try{ apiFetch('/api/me').then(m=>{ if(m&&m.username) document.getElementById('who').textContent=m.username; }).catch(()=>{}); }catch(e){}

const FAQ=[
  ['Getting started','How do I make my first estimate?','Open <b>Estimate → Estimates</b> and click New. Add line items (type a price, or use build-up = material + labor). Set your Overhead and Profit %, then use <b>Generate PDF</b> to send it, or <b>Share for approval</b> for an online link the customer can approve.'],
  ['Getting started','Where do I set my company info and logo?','Go to <b>Home → Company</b>. Your name, logo, license and address print on every PDF automatically.'],
  ['Estimates','What is the difference between Flat and Build-up pricing?','<b>Flat</b> = you type a unit price (line total = qty × price). <b>Build-up</b> = you enter the material $ and labor (hours × rate); the line total is that, and the unit price shown is total ÷ quantity.'],
  ['Estimates','How do markup by category and tax rules work?','On <b>Company → Markup by category</b>, set a markup % and taxable yes/no per trade code. Any estimate line with that code uses those instead of your default Overhead+Profit. Tax is charged on materials only by default.'],
  ['Estimates','What are optional add-ons / alternates?','Tick <b>Optional add-on</b> on any estimate line. It drops out of the Total and shows in its own “Optional add-ons” section on the proposal so the customer can choose it. It is not billed unless you add it.'],
  ['Estimates','Can customers approve an estimate online?','Yes — click <b>Share for approval</b> to get a link. The customer reviews it and types their name to accept; the estimate flips to Accepted automatically.'],
  ['Invoices','How do I turn an estimate into an invoice?','Open the accepted estimate and click <b>→ Invoice</b>. Your markup is folded into the prices (the customer never sees it) and the totals match the estimate to the penny.'],
  ['Invoices','How do customers pay online?','On the invoice, paste your own payment link (Stripe Payment Link, PayPal.Me, Venmo, Square) in <b>Online payment</b>. It shows as a green <b>Pay Now</b> button on the invoice PDF and email.'],
  ['Invoices','How do I email a proposal or invoice?','Use the <b>✉ Email</b> button — it opens your own email app pre-filled with the customer, subject and a link. (Automatic sending from the app needs an email service connected later.)'],
  ['Jobs','What is the punch list?','Each job has a <b>Punch list</b> — end-of-job fixes with a location, checked off as they’re done. It prints on the job sheet.'],
  ['People','How do I add an employee or their pay rate?','<b>Home → Employees</b>. Add each person with their charged hourly rate, contact info and payroll employee #. Rates auto-fill when you log time on a job.'],
  ['People','How do I add a field employee login?','<b>Home → Team → Add a team member</b>, choose role <b>Field employee</b>. They only see their jobs (no pricing, invoices or reports) and can log time, daily logs, punch items and photos.'],
  ['People','How does subcontractor compliance work?','<b>Job → Subcontractors</b> tracks each sub’s W-9, insurance (COI) and license expiration. Fieldscale flags anything expired or expiring within 30 days.'],
  ['Account & security','How do I change my password?','<b>Home → Change Password</b>. You stay logged in on this device; other devices are signed out for safety.'],
  ['Account & security','Is my data backed up?','Yes — the server automatically snapshots your data daily (owners can also click <b>Back up now</b> on the Team page), and you can download a full export from the Team page anytime.'],
  ['Account & security','Who can see what?','Owners/admins see everything. Members see the app but the Team page is owner/admin only. Field employees only see their assigned jobs — never pricing, profit, invoices or reports.']
];

function render(list){
  document.getElementById('faqs').innerHTML = list.length ? list.map(f=>
    `<details class="faq"><summary>${f[1]}</summary><div class="body">${f[2]}</div></details>`).join('')
    : '<div style="color:var(--steel);padding:20px 0">No matches — try another word.</div>';
}
function esc(s){ return String(s).toLowerCase(); }
document.getElementById('q').addEventListener('input', e=>{
  const q=esc(e.target.value.trim());
  render(!q ? FAQ : FAQ.filter(f=> esc(f[0]+' '+f[1]+' '+f[2]).includes(q)));
});
render(FAQ);

// Downloadable PDF guides (served from /guides). Jobs guide will be added once that section is finalized.
const GUIDES=[
  ['01','Getting Started','What Fieldscale is, signing in, and finding your way around','Fieldscale-01-Getting-Started.pdf'],
  ['02','Takeoff','Measure quantities straight off your PDF plans','Fieldscale-02-Takeoff.pdf'],
  ['03','Leads & Customers','Pipeline, customers, and follow-ups','Fieldscale-03-Leads-Customers.pdf'],
  ['04','Estimating','Estimates, price book, and the field tools','Fieldscale-04-Estimating.pdf'],
  ['05','Invoicing & Reports','Billing, payments, portal, and reports','Fieldscale-05-Invoicing-Reports.pdf'],
  ['06','Owner, Team & Settings','Team roles, company profile, AI training, guest links','Fieldscale-06-Owner-Team-Settings.pdf']
];
document.getElementById('guides').innerHTML = GUIDES.map(g=>
  `<a href="/guides/${g[3]}" target="_blank" download style="display:block;border:1px solid var(--steel-light,#d2d8df);border-radius:8px;padding:12px 14px;text-decoration:none;color:inherit;background:var(--surface,#fff)">
     <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1px;color:#E8833A;font-weight:700">PART ${g[0]}</div>
     <div style="font-weight:600;color:var(--charcoal,#12314c);margin:2px 0 3px">${g[1]}</div>
     <div style="font-size:12px;color:var(--steel,#5b6675);line-height:1.4">${g[2]}</div>
     <div style="font-size:11.5px;color:#E8833A;margin-top:7px;font-weight:600">⬇ Download PDF</div>
   </a>`).join('');
</script>
</body>
</html>
