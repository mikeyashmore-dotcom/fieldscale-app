<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldscale — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fs-theme.css">
<style>
  .wrap{padding-top:16px}
  .hi{font-family:'Oswald',sans-serif;font-size:23px;font-weight:600;margin:0 0 2px}
  .hi .co{color:var(--cyan-dim)}
  .sub{color:var(--steel);margin:0 0 14px}
  h2{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;margin:16px 0 7px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;text-decoration:none;display:block;transition:border-color .12s}
  a.tile:hover{border-color:var(--cyan-dim)}
  .tile .lab{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel)}
  .tile .v{font-family:'Oswald',sans-serif;font-size:23px;font-weight:600;color:var(--heading);margin-top:2px}
  .tile .v.pos{color:var(--good)} .tile .v.neg{color:var(--danger)} .tile .v.warn{color:var(--orange-dim)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .cards-group{font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan-dim);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--paper-line)}
  .cards-group:first-child{margin-top:2px}
  .card{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:11px 14px;text-decoration:none;color:var(--heading);display:flex;align-items:center;gap:11px;transition:border-color .12s,transform .12s;width:100%;text-align:left;font:inherit;cursor:pointer}
  .card:hover{border-color:var(--cyan-dim);transform:translateY(-1px)}
  .card .ic{font-size:20px;flex:none}
  .card .t{font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px}
  .card .d{color:var(--steel);font-size:12px;margin-top:1px}
  .attn{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:4px 16px}
  .attn a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--paper-line);text-decoration:none;color:var(--heading);font-size:14px}
  .attn a:last-child{border-bottom:none}
  .attn a:hover{color:var(--cyan-dim)}
  .attn .pill{font-family:'IBM Plex Mono',monospace;font-size:12px}
  .attn .over{color:var(--danger)} .attn .soon{color:var(--orange-dim)}
  .attn-empty{color:var(--steel);padding:16px 0;font-size:13px}
</style>
<script src="/app-nav.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>FIELDSCALE</div>
  <nav></nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <a href="#" id="logout-link" style="color:var(--steel-light);font-size:13px;margin-left:14px;text-decoration:none">Log out</a>
</header>

<div class="wrap">
  <div id="loading" class="loading">Loading…</div>
  <div id="content" style="display:none">
    <h1 class="hi">Welcome back<span id="co-wrap">, <span class="co" id="co-name"></span></span></h1>
    <p class="sub">Here's where your business stands today.</p>

    <div id="ai-ask" style="display:none;background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-family:'Oswald',sans-serif;font-weight:600;color:var(--heading)">✨ Ask Fieldscale</span>
        <span id="ai-on" style="font-size:11px;color:var(--good);background:rgba(74,155,110,.12);padding:1px 8px;border-radius:20px">AI on</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="ai-q" placeholder="e.g. which invoices are unpaid?  ·  what did we quote the Smiths?" style="flex:1;padding:9px 11px;border:1px solid var(--steel-light);border-radius:var(--radius);font:14px inherit">
        <button class="btn primary" id="ai-ask-btn" style="white-space:nowrap">Ask</button>
      </div>
    </div>

    <div id="onboard" style="display:none;background:var(--surface);border:1px solid var(--paper-line);border-left:3px solid var(--cyan-dim);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <h2 style="margin:0 0 2px">Get set up <span id="ob-count" style="font-size:12px;color:var(--steel);font-weight:400"></span></h2>
        <a href="#" id="ob-dismiss" style="font-size:12px;color:var(--steel)">Dismiss</a>
      </div>
      <p style="font-size:12.5px;color:var(--steel);margin:0 0 10px">A few quick steps to get the most out of Fieldscale.</p>
      <div id="ob-steps"></div>
    </div>

    <div class="tiles" id="stat-tiles"></div>

    <h2>Needs attention</h2>
    <div class="attn" id="attn"></div>

    <h2>Jump to</h2>
    <div id="cards"></div>

    <div style="margin-top:28px;padding-top:14px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--steel)">
      <a href="/help.html" style="color:var(--steel)">Help &amp; FAQ</a> ·
      <a href="/privacy.html" style="color:var(--steel)">Privacy</a>
    </div>
  </div>
</div>

<div id="pw-modal" style="position:fixed;inset:0;background:rgba(14,42,71,.55);display:none;align-items:center;justify-content:center;z-index:200">
  <div style="background:var(--surface);border-radius:6px;padding:22px;width:340px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.3)">
    <h3 style="font-family:'Oswald',sans-serif;margin:0 0 6px;color:var(--heading);font-size:18px">Change Password</h3>
    <label style="display:block;font-size:12px;color:var(--steel);margin:10px 0 3px">Current password</label>
    <input type="password" id="pw-cur" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--steel-light);border-radius:3px;font-size:14px" />
    <label style="display:block;font-size:12px;color:var(--steel);margin:10px 0 3px">New password</label>
    <input type="password" id="pw-new" autocomplete="new-password" placeholder="at least 8 characters" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--steel-light);border-radius:3px;font-size:14px" />
    <label style="display:block;font-size:12px;color:var(--steel);margin:10px 0 3px">Confirm new password</label>
    <input type="password" id="pw-conf" autocomplete="new-password" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--steel-light);border-radius:3px;font-size:14px" />
    <div id="pw-msg" style="font-size:12.5px;margin-top:8px;min-height:16px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" id="pw-cancel" type="button">Cancel</button>
      <button class="btn primary" id="pw-save" type="button">Update password</button>
    </div>
  </div>
</div>

<script>
const TOKEN_STORAGE='fieldscale_token';
function getToken(){ return localStorage.getItem(TOKEN_STORAGE); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='logout-link'){ e.preventDefault(); localStorage.removeItem('fieldscale_token'); localStorage.removeItem('fieldscale_username'); location.href='/'; } });
if(!getToken()){ location.href='/'; }
async function apiFetch(path){
  const res=await fetch(path,{headers:{'Authorization':'Bearer '+getToken()}});
  if(res.status===401){ location.href='/'; throw new Error('Session expired'); }
  const data=await res.json(); if(!res.ok) throw new Error(data.error||'Request failed'); return data;
}
function money(n){ n=Number(n)||0; return '$'+n.toLocaleString(undefined,{maximumFractionDigits:0}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Quick-link cards, grouped to match the top-nav sections (Leads / Takeoff / Estimate / Job /
// Invoice) plus an Account & setup group for the rest. Each ties to a module so we can hide ones
// the company isn't on.
const CARD_GROUPS = ['Leads', 'Takeoff', 'Estimate', 'Job', 'Invoice', 'Account & setup'];
const CARDS=[
  {href:'/leads.html',icon:'🎯',t:'Leads',d:'New opportunities',mod:'crm',group:'Leads'},
  {href:'/customers.html',icon:'👥',t:'Customers',d:'Everyone in one place',mod:'crm',group:'Leads'},
  {href:'/followups.html',icon:'⏰',t:'Follow-ups',d:'Who to chase',mod:null,group:'Leads'},
  {href:'/',icon:'📐',t:'Takeoff',d:'Measure off plans',mod:'takeoff',group:'Takeoff'},
  {href:'/proposals.html',icon:'📝',t:'Estimates',d:'Quote the work',mod:'estimating',group:'Estimate'},
  {href:'/estimates.html',icon:'📚',t:'Price Book',d:'Your costs & assemblies',mod:'estimating',group:'Estimate'},
  {href:'/fieldmeasure.html',icon:'📏',t:'Field Measure',d:'Measure without plans',mod:'estimating',group:'Estimate'},
  {href:'/plans.html',icon:'📐',t:'Floor Plans',d:'Sketch a plan to scale',mod:'estimating',group:'Estimate'},
  {href:'/jobs.html',icon:'🔨',t:'Jobs',d:'Work you\'ve won',mod:'jobs',group:'Job'},
  {href:'/schedule.html',icon:'📅',t:'Schedule',d:'Jobs on a calendar',mod:'jobs',group:'Job'},
  {href:'/workorders.html',icon:'🧾',t:'Work Orders',d:'Send crews out',mod:'jobs',group:'Job'},
  {href:'/purchase-orders.html',icon:'📦',t:'Purchase Orders',d:'Order materials',mod:'jobs',group:'Job'},
  {href:'/subs.html',icon:'🤝',t:'Subcontractors',d:'Subs & compliance',mod:'jobs',group:'Job'},
  {href:'/invoices.html',icon:'💵',t:'Invoices',d:'Bill & get paid',mod:'invoicing',group:'Invoice'},
  {href:'/reports.html',icon:'📊',t:'Reports',d:'The full picture',mod:null,group:'Invoice'},
  {href:'/employees.html',icon:'👷',t:'Employees',d:'Crew, rates & payroll #',mod:null,group:'Account & setup'},
  {href:'/company.html',icon:'⚙️',t:'Company',d:'Profile & settings',mod:null,group:'Account & setup'},
  {href:'/admin.html',icon:'👤',t:'Team',d:'Logins & user roles',mod:null,admin:true,group:'Account & setup'},
  {href:'/help.html',icon:'❓',t:'Help & FAQ',d:'How things work',mod:null,group:'Account & setup'},
  {action:'pw',icon:'🔑',t:'Change Password',d:'Update your login',mod:null,group:'Account & setup'}
];

function tile(lab,val,cls,href){
  const inner=`<div class="lab">${lab}</div><div class="v${cls?(' '+cls):''}">${val}</div>`;
  return href ? `<a class="tile" href="${href}">${inner}</a>` : `<div class="tile">${inner}</div>`;
}

async function init(){
  let me;
  try{ me=await apiFetch('/api/me'); document.getElementById('who').textContent=me.username; }catch(e){ return; }
  // Use the profile's Company Name (via branding) so this matches the header and the field you edit.
  let coName = me.companyName || '';
  try{ const br=await apiFetch('/api/branding'); if(br.companyName) coName=br.companyName; }catch(e){}
  document.getElementById('co-name').textContent = coName;
  if(!coName) document.getElementById('co-wrap').style.display='none';

  // Cards — hide ones for modules this company isn't on, and admin-only cards for non-admins.
  const enabled = Array.isArray(me.modules) ? me.modules : null;
  const isAdmin = me.role==='owner' || me.role==='admin' || me.platformAdmin;
  const cardsOn = CARDS.filter(c => (!c.mod || !enabled || enabled.indexOf(c.mod)>=0) && (!c.admin || isAdmin));
  const cardHtml = c => {
    const inner=`<span class="ic">${c.icon}</span><span><span class="t">${esc(c.t)}</span><br><span class="d">${esc(c.d)}</span></span>`;
    return c.action ? `<button class="card" type="button" data-action="${c.action}" style="text-align:left;font:inherit;cursor:pointer">${inner}</button>`
                    : `<a class="card" href="${c.href}">${inner}</a>`;
  };
  // Group the cards under sub-headers that mirror the top nav (Leads / Takeoff / Estimate / Job / Invoice).
  document.getElementById('cards').innerHTML = CARD_GROUPS.map(g=>{
    const gc = cardsOn.filter(c => c.group === g);
    if(!gc.length) return '';
    return `<h3 class="cards-group">${esc(g)}</h3><div class="cards">${gc.map(cardHtml).join('')}</div>`;
  }).join('');
  document.getElementById('cards').addEventListener('click', e=>{
    const b=e.target.closest('[data-action="pw"]'); if(b) openPwModal();
  });

  if(isAdmin) loadOnboarding();

  // Stats + needs-attention (best-effort; fine if a section is empty).
  try{
    const [r,fu] = await Promise.all([ apiFetch('/api/reports/summary'), apiFetch('/api/followups') ]);
    const overdueInv = (fu.invoices||[]).filter(i=>i.overdue).length;
    const dueLeads = (fu.leads||[]).filter(l=>l.overdue).length;
    document.getElementById('stat-tiles').innerHTML =
      tile('Outstanding', money(r.ar.outstanding), r.ar.outstanding>0?'warn':'', '/reports.html') +
      tile('Expected ≤30 days', money(r.cashflow.d0_30), 'pos', '/reports.html') +
      tile('Active jobs', r.production.activeJobs||0, '', '/jobs.html') +
      tile('Behind schedule', (r.production.behind||[]).length, (r.production.behind||[]).length?'neg':'', '/reports.html') +
      tile('Win rate', r.estimates.winRate==null?'—':r.estimates.winRate+'%', 'pos', '/reports.html') +
      tile('To follow up', (dueLeads+overdueInv), (dueLeads+overdueInv)?'warn':'', '/followups.html');

    // Needs attention: a few overdue invoices + due leads.
    const items=[];
    (fu.invoices||[]).slice(0,4).forEach(i=>items.push({href:'/invoice.html?id='+i.id,
      text:'Invoice: '+(i.name||'—')+(i.client?(' · '+i.client):''),
      pill:(i.daysOver>0?('<span class="over">'+i.daysOver+'d overdue</span>'):'<span class="soon">due</span>')+' · '+money(i.owed)}));
    (fu.leads||[]).filter(l=>l.overdue).slice(0,4).forEach(l=>items.push({href:'/lead.html?id='+l.id,
      text:'Follow up: '+(l.name||'—'), pill:'<span class="over">due '+esc(l.followUp)+'</span>'}));
    const attn=document.getElementById('attn');
    attn.innerHTML = items.length ? items.map(x=>`<a href="${x.href}"><span>${esc(x.text)}</span><span class="pill">${x.pill}</span></a>`).join('')
      : '<div class="attn-empty">Nothing needs attention right now. 🎉</div>';
  }catch(e){
    document.getElementById('stat-tiles').innerHTML='';
    document.getElementById('attn').innerHTML='<div class="attn-empty">Stats will appear as you add estimates, jobs and invoices.</div>';
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  setupAiAsk();
}

// ---- Conversational search across the company's records (shown only when AI is on) ----
function setupAiAsk(){
  fsAI.status().then(s=>{ if(s.enabled) document.getElementById('ai-ask').style.display=''; });
  const ask=()=>{ const q=document.getElementById('ai-q').value.trim(); if(!q) return;
    fsAiRun({ title:'✨ '+q, loading:'Searching your records…', run:()=>fsAI.post('/api/ai/search',{query:q}) });
  };
  document.getElementById('ai-ask-btn').addEventListener('click', ask);
  document.getElementById('ai-q').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });
}

// ---- Guided onboarding checklist (new accounts) ----
async function loadOnboarding(){
  if(localStorage.getItem('fs_onboard_dismissed')==='1') return;
  let prof={}, pb={items:[]}, ests=[];
  try{ const c=await apiFetch('/api/company'); prof=c.profile||{}; }catch(e){}
  try{ pb=await apiFetch('/api/pricebook'); }catch(e){}
  try{ ests=await apiFetch('/api/estimates'); }catch(e){}
  const steps=[
    { label:'Set up your company profile (name, logo, license)', href:'/company.html', done: !!(prof.name && (prof.logo||prof.license||prof.address)) },
    { label:'Add your crew on the Employees page', href:'/employees.html', done: !!(prof.team && prof.team.length) },
    { label:'Build your price book', href:'/estimates.html', done: !!(pb.items && pb.items.length) },
    { label:'Create your first estimate', href:'/proposals.html', done: !!(ests && ests.length) }
  ];
  const doneCount=steps.filter(s=>s.done).length;
  if(doneCount===steps.length) return; // all set — no need to show it
  document.getElementById('ob-count').textContent = '· '+doneCount+' of '+steps.length+' done';
  document.getElementById('ob-steps').innerHTML = steps.map(s=>
    `<div style="padding:6px 0;font-size:14px">${s.done?'<span style="color:var(--good)">✓</span>':'<span style="color:var(--steel-light)">○</span>'} `+
    (s.done?`<span style="color:var(--steel)">${esc(s.label)}</span>`:`<a href="${s.href}">${esc(s.label)}</a>`)+`</div>`).join('');
  document.getElementById('onboard').style.display='';
}
document.getElementById('ob-dismiss').addEventListener('click', e=>{ e.preventDefault(); localStorage.setItem('fs_onboard_dismissed','1'); document.getElementById('onboard').style.display='none'; });

// ---- Change Password (moved here from the header account menu) ----
const pwModal=document.getElementById('pw-modal');
function openPwModal(){ document.getElementById('pw-msg').textContent=''; document.getElementById('pw-cur').value=''; document.getElementById('pw-new').value=''; document.getElementById('pw-conf').value=''; pwModal.style.display='flex'; }
function closePwModal(){ pwModal.style.display='none'; }
pwModal.addEventListener('click', e=>{ if(e.target===pwModal) closePwModal(); });
document.getElementById('pw-cancel').addEventListener('click', closePwModal);
document.getElementById('pw-save').addEventListener('click', async ()=>{
  const cur=document.getElementById('pw-cur').value, nw=document.getElementById('pw-new').value, cf=document.getElementById('pw-conf').value;
  const msg=document.getElementById('pw-msg'); msg.style.color='var(--danger)';
  if(!cur||!nw){ msg.textContent='Fill in your current and new password.'; return; }
  if(nw!==cf){ msg.textContent='The new passwords don’t match.'; return; }
  try{
    const res=await fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({currentPassword:cur,newPassword:nw})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){ msg.textContent=data.error||'Could not change password.'; return; }
    if(data.token){ try{ localStorage.setItem('fieldscale_token',data.token); }catch(e){} }
    msg.style.color='var(--good)'; msg.textContent='Password updated.';
    setTimeout(closePwModal,900);
  }catch(e){ msg.textContent='Network error — try again.'; }
});
init();
</script>
</body>
</html>
