<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldscale — Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fs-theme.css">
<meta name="fs-module" content="crm">
<script src="/app-nav.js"></script>
<style>
  .wrap{max-width:920px}
  .pagebar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .pagebar .title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
  .lf-list{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
  .lf-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--paper-line);border-radius:20px;padding:2px 6px 2px 10px;font-size:12px}
  .lf-chip a{color:var(--accent);text-decoration:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lf-chip button{background:none;border:none;color:var(--steel-light);cursor:pointer;font-size:12px;padding:0 2px}
  .lf-chip button:hover{color:var(--danger)}
  .pagebar .spacer{flex:1}
  .pagebar select{width:auto;padding:6px 8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  .block{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;margin-bottom:18px}
  .block h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin:0 0 10px}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:12px;color:var(--steel);margin-bottom:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  textarea{min-height:80px;resize:vertical}
  input.num{font-family:'IBM Plex Mono',monospace}
  @media (max-width:760px){ .grid2{grid-template-columns:1fr} .row2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>FIELDSCALE</div>
  <nav>
    <a href="/">Takeoff</a>
    <a href="/leads.html" class="active">Leads</a>
    <a href="/customers.html">Customers</a>
    <a href="/proposals.html">Estimates</a>
    <a href="/jobs.html">Jobs</a>
    <a href="/schedule.html">Schedule</a>
    <a href="/purchase-orders.html">Purchase Orders</a>
    <a href="/workorders.html">Work Orders</a>
    <a href="/invoices.html">Invoices</a>
    <a href="/estimates.html">Price Book</a>
    <a href="/followups.html">Follow-ups</a>
    <a href="/reports.html">Reports</a>
    <a href="/company.html">Company</a>
    <a href="/admin.html" id="owner-nav">Owner</a>
  </nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <a href="#" id="logout-link" style="color:var(--steel-light);font-size:13px;margin-left:14px;text-decoration:none">Log out</a>
</header>

<div class="wrap">
  <div id="loading" class="loading">Loading…</div>
  <div id="content" style="display:none">
    <div class="pagebar">
      <a href="/leads.html" class="btn ghost">← Leads</a>
      <span class="title" id="lead-title">Lead</span>
      <select id="stage">
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="estimating">Estimating</option>
        <option value="won">Won</option>
        <option value="lost">Lost</option>
        <option value="on hold">On hold</option>
      </select>
      <div class="spacer"></div>
      <a class="btn ghost" id="open-est" style="display:none" title="Open the estimate created from this lead">Open estimate</a>
      <button class="btn ghost" id="to-est-btn" title="Start an estimate from this lead">→ Estimate</button>
      <button class="btn primary" id="save-btn">Save</button>
    </div>

    <div class="grid2">
      <div class="block" style="margin-bottom:0">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Contact</h3><button type="button" class="btn ghost" id="dictate-contact" style="font-size:12px;padding:5px 11px;white-space:nowrap">🎤 Dictate</button></div>
        <div class="field"><label>Contact name</label><input id="lead-name" placeholder="Customer / company name" /></div>
        <div class="row2">
          <div class="field"><label>Phone</label><input id="phone" placeholder="000-000-0000" /></div>
          <div class="field"><label>Email</label><input id="email" placeholder="name@email.com" /></div>
        </div>
        <div class="field"><label>Project address</label><span id="lead-addr"></span></div>
        <div class="field"><label>First contact date</label><input id="first-contact" type="date" /></div>
      </div>
      <div class="block" style="margin-bottom:0">
        <h3>Opportunity</h3>
        <div class="field"><label>Type of work</label><input id="work-type" placeholder="e.g. Kitchen remodel" /></div>
        <div class="row2">
          <div class="field"><label>Estimated value $</label><input id="value" class="num" inputmode="decimal" placeholder="0" /></div>
          <div class="field"><label>Lead source</label><input id="source" placeholder="Referral, website, …" /></div>
        </div>
        <div class="field"><label>Follow-up date</label><input id="follow-up" type="date" /></div>
      </div>
    </div>

    <div class="block">
      <h3>Notes</h3>
      <textarea id="notes" placeholder="What they want, budget, timeline, conversation notes…"></textarea>
    </div>

    <div class="block">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">Site visit</h3><button type="button" class="btn ghost" id="dictate-sv" style="font-size:12px;padding:5px 11px;white-space:nowrap">🎤 Dictate</button></div>
      <p style="font-size:12px;color:var(--steel);margin:0 0 10px">Capture what you saw on site so it seeds the estimate scope.</p>
      <div class="row2">
        <div class="field"><label>Visit date</label><input id="sv-date" type="date" /></div>
        <div class="field"><label>Who was present</label><input id="sv-present" placeholder="Names" /></div>
      </div>
      <div class="field"><label>Access instructions</label><input id="sv-access" placeholder="Gate code, park in rear, dog on site…" /></div>
      <div class="field"><label>Scope / observations</label><textarea id="sv-scope" placeholder="What the job involves, conditions, measurements, materials…"></textarea></div>
      <div class="field"><label>Risks / concerns</label><input id="sv-risks" placeholder="Access, hazards, unknowns…" /></div>
      <div class="field"><label>Site photos &amp; files</label>
        <div class="lf-list" id="lead-files"></div>
        <input type="file" id="lead-file-input" accept="image/*,application/pdf" multiple style="display:none" />
        <button type="button" class="btn ghost" id="lead-file-btn" style="font-size:12px;padding:4px 10px">＋ Upload photo / file</button>
        <span id="lead-file-status" style="font-size:12px;color:var(--steel);margin-left:8px"></span>
      </div>
      <div class="field"><label>Customer sign-off (they sign below)</label>
        <div style="border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--surface);display:inline-block">
          <canvas id="sv-sig" width="360" height="110" style="touch-action:none;display:block;max-width:100%"></canvas>
        </div>
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center"><button type="button" class="btn ghost" id="sv-sig-clear" style="font-size:12px;padding:4px 10px">Clear</button><span id="sv-sig-note" style="font-size:12px;color:var(--steel)"></span></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN_STORAGE='fieldscale_token';
function getToken(){ return localStorage.getItem(TOKEN_STORAGE); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='logout-link'){ e.preventDefault(); localStorage.removeItem('fieldscale_token'); localStorage.removeItem('fieldscale_username'); location.href='/'; } });
if(!getToken()){ location.href='/'; }
const leadId = new URLSearchParams(location.search).get('id');
if(!leadId){ location.href='/leads.html'; }
async function apiFetch(path, options={}){
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  const t=getToken(); if(t) headers['Authorization']='Bearer '+t;
  const res=await fetch(path, Object.assign({}, options, {headers}));
  if(res.status===401){ location.href='/'; throw new Error('Session expired'); }
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Request failed');
  return data;
}
let toastTimer; function toast(m,e){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2200); }
function val(id){ return document.getElementById(id).value; }
function set(id,v){ document.getElementById(id).value=(v==null?'':v); }
// Rebuild the stage dropdown from the company's Leads-board columns, plus the reserved
// Estimating / Won / Lost stages. Keeps this page in sync with columns added on the board,
// so opening & saving a lead never resets a custom stage.
async function populateStageOptions(current){
  let stages=[];
  try{ const r=await apiFetch('/api/lead-stages'); stages=r.stages||[]; }catch(e){}
  const sel=document.getElementById('stage'); if(!sel) return;
  let opts = stages.map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.label)}</option>`);
  opts = opts.concat('<option value="estimating">Estimating</option>','<option value="won">Won</option>','<option value="lost">Lost</option>');
  // Make sure the lead's current stage is always selectable even if that column was removed.
  if(current && !stages.some(s=>s.id===current) && !['estimating','won','lost'].includes(current)){
    opts.unshift(`<option value="${escapeHtml(current)}">${escapeHtml(current)}</option>`);
  }
  sel.innerHTML = opts.join('');
}

let doc={};
// ---- Signature pad ----
const sigCanvas=document.getElementById('sv-sig'), sctx=sigCanvas.getContext('2d');
let sigDrawing=false, sigDirty=false;
sctx.lineWidth=2; sctx.lineCap='round'; sctx.strokeStyle='#1E242C';
function sigPos(e){ const r=sigCanvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return { x:(p.clientX-r.left)*(sigCanvas.width/r.width), y:(p.clientY-r.top)*(sigCanvas.height/r.height) }; }
function sigStart(e){ e.preventDefault(); sigDrawing=true; sigDirty=true; const p=sigPos(e); sctx.beginPath(); sctx.moveTo(p.x,p.y); }
function sigMove(e){ if(!sigDrawing) return; e.preventDefault(); const p=sigPos(e); sctx.lineTo(p.x,p.y); sctx.stroke(); }
function sigEnd(){ sigDrawing=false; }
sigCanvas.addEventListener('pointerdown',sigStart); sigCanvas.addEventListener('pointermove',sigMove);
window.addEventListener('pointerup',sigEnd);
document.getElementById('sv-sig-clear').addEventListener('click',()=>{ sctx.clearRect(0,0,sigCanvas.width,sigCanvas.height); sigDirty=false; document.getElementById('sv-sig-note').textContent=''; });
function loadSig(dataUrl){ if(!dataUrl) return; const img=new Image(); img.onload=()=>{ sctx.clearRect(0,0,sigCanvas.width,sigCanvas.height); sctx.drawImage(img,0,0,sigCanvas.width,sigCanvas.height); }; img.src=dataUrl; document.getElementById('sv-sig-note').textContent='Signed on file.'; }
function sigDataUrl(existing){ return sigDirty ? sigCanvas.toDataURL('image/png') : (existing||''); }

async function save(){
  const sv=doc.siteVisit||{};
  const addrParts=fsAddr.parts('lead-addr');
  await apiFetch('/api/leads/'+leadId, { method:'PUT', body: JSON.stringify({
    name: val('lead-name')||'New Lead', workType: val('work-type'), value: parseFloat(val('value'))||0,
    stage: val('stage'), source: val('source'), followUp: val('follow-up'),
    doc: { phone: val('phone'), email: val('email'), address: fsAddr.line(addrParts), addressParts: addrParts, notes: val('notes'),
      firstContact: val('first-contact'),
      siteVisit: { date: val('sv-date'), present: val('sv-present'), access: val('sv-access'),
        scope: val('sv-scope'), risks: val('sv-risks'), signature: sigDataUrl(sv.signature) } }
  }) });
}
// Keep the page heading in sync with the contact name (name now lives in the Contact box).
function syncTitle(){ const n=(val('lead-name')||'').trim(); document.getElementById('lead-title').textContent = n || 'Lead'; }
document.getElementById('lead-name').addEventListener('input', syncTitle);

// ---- Voice-to-form: speak the details, AI fills the fields ----
function applyValues(map, values){ let n=0; for(const key in map){ const v=values[key]; if(v==null||String(v).trim()==='') continue; map[key](String(v).trim()); n++; } return n; }
function dictateDone(n){ toast(n ? ('Filled '+n+' field'+(n>1?'s':'')+' — check and edit as needed.') : 'Couldn’t pick out any details — try again with a bit more.'); }
const _dc=document.getElementById('dictate-contact');
if(_dc) _dc.addEventListener('click', function(){ window.fsDictate({
  title:'Dictate contact details',
  fields:[
    {key:'name',label:'Contact name',hint:'person or company'},
    {key:'phone',label:'Phone'},
    {key:'email',label:'Email'},
    {key:'address',label:'Project address',hint:'street, city, state ZIP'},
    {key:'workType',label:'Type of work',hint:'e.g. kitchen remodel, roof replacement'},
    {key:'value',label:'Estimated value',hint:'dollars, number only'},
    {key:'source',label:'Lead source',hint:'referral, website, etc.'},
    {key:'notes',label:'Notes',hint:'anything else worth writing down'}
  ],
  onValues:function(v){ applyValues({
    name:x=>{ set('lead-name',x); syncTitle(); },
    phone:x=>set('phone',x), email:x=>set('email',x),
    address:x=>fsAddr.set('lead-addr',x),
    workType:x=>set('work-type',x),
    value:x=>set('value', String(x).replace(/[^0-9.]/g,'')),
    source:x=>set('source',x),
    notes:x=>{ const cur=val('notes'); set('notes', cur? (cur+'\n'+x): x); }
  }, v); },
  onDone:dictateDone
}); });
const _ds=document.getElementById('dictate-sv');
if(_ds) _ds.addEventListener('click', function(){ window.fsDictate({
  title:'Dictate site visit',
  fields:[
    {key:'present',label:'Who was present',hint:'names'},
    {key:'access',label:'Access instructions',hint:'gate code, parking, dog on site'},
    {key:'scope',label:'Scope / observations',hint:'what the job involves, conditions, measurements, materials'},
    {key:'risks',label:'Risks / concerns',hint:'access, hazards, unknowns'}
  ],
  onValues:function(v){ applyValues({
    present:x=>set('sv-present',x), access:x=>set('sv-access',x),
    scope:x=>{ const cur=val('sv-scope'); set('sv-scope', cur? (cur+'\n'+x): x); },
    risks:x=>set('sv-risks',x)
  }, v); },
  onDone:dictateDone
}); });

// ---- Site-visit files ----
function renderLeadFiles(){
  const wrap=document.getElementById('lead-files'); const files=doc.files||[];
  wrap.innerHTML = files.length ? files.map(f=>`<span class="lf-chip"><a href="#" data-view="${f.id}" title="${escAttr(f.name)}">${esc(f.name)}</a><button data-del="${f.id}" title="Remove">✕</button></span>`).join('')
    : '<span style="font-size:12px;color:var(--steel)">No files yet.</span>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
document.getElementById('lead-file-btn').addEventListener('click', ()=>document.getElementById('lead-file-input').click());
document.getElementById('lead-file-input').addEventListener('change', async (e)=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  const st=document.getElementById('lead-file-status');
  for(const f of files){
    st.textContent='Uploading '+f.name+'…';
    try{
      const res=await fetch('/api/leads/'+leadId+'/files?name='+encodeURIComponent(f.name.slice(0,120)),
        {method:'POST',headers:{'Authorization':'Bearer '+getToken(),'Content-Type':f.type||'application/octet-stream'},body:f});
      const d=await res.json().catch(()=>({})); if(!res.ok) throw new Error(d.error||'Upload failed');
      doc.files=doc.files||[]; doc.files.push(d);
    }catch(err){ toast(err.message,true); }
  }
  st.textContent=''; renderLeadFiles();
});
document.getElementById('lead-files').addEventListener('click', async (e)=>{
  const v=e.target.getAttribute && e.target.getAttribute('data-view');
  if(v){ e.preventDefault();
    try{ const res=await fetch('/api/leads/'+leadId+'/files/'+v,{headers:{'Authorization':'Bearer '+getToken()}});
      if(!res.ok) throw new Error(); const u=URL.createObjectURL(await res.blob()); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),60000);
    }catch(err){ toast('Could not open file.',true); } return; }
  const d=e.target.getAttribute && e.target.getAttribute('data-del');
  if(d){ if(!confirm('Remove this file?')) return;
    try{ await apiFetch('/api/leads/'+leadId+'/files/'+d,{method:'DELETE'}); doc.files=(doc.files||[]).filter(f=>f.id!==d); renderLeadFiles(); toast('File removed.'); }
    catch(err){ toast(err.message,true); } }
});
document.getElementById('save-btn').addEventListener('click', async ()=>{ try{ await save(); toast('Lead saved.'); }catch(err){ toast(err.message,true); } });
document.getElementById('to-est-btn').addEventListener('click', async ()=>{
  const nm=(val('lead-name')||'').trim();
  if(!nm || nm.toLowerCase()==='new lead'){
    toast('Add the customer’s name at the top first — that’s what carries onto the estimate.', true);
    const f=document.getElementById('lead-name'); f.focus(); f.select();
    return;
  }
  if(!confirm('Start an estimate from this lead? “'+nm+'” and the project details carry over, and the lead moves to “Estimating”.')) return;
  try{ await save(); const r=await apiFetch('/api/estimates/from-lead',{method:'POST',body:JSON.stringify({leadId})}); location.href='/estimate.html?id='+encodeURIComponent(r.id); }
  catch(err){ toast(err.message,true); }
});

async function init(){
  document.getElementById('lead-addr').innerHTML=fsAddr.html('lead-addr');
  try{ const me=await apiFetch('/api/me'); document.getElementById('who').textContent=me.username; }catch(e){ return; }
  try{
    const l=await apiFetch('/api/leads/'+leadId);
    await populateStageOptions(l.stage);   // stage dropdown mirrors the Leads-board columns (+ Estimating/Won/Lost)
    set('lead-name', l.name); document.getElementById('stage').value=l.stage||'new';
    set('work-type', l.workType); set('value', l.value||''); set('source', l.source); set('follow-up', l.followUp);
    doc=l.doc||{};
    set('phone', doc.phone); set('email', doc.email); fsAddr.set('lead-addr', doc.addressParts || doc.address); set('notes', doc.notes);
    set('first-contact', doc.firstContact); syncTitle(); renderLeadFiles();
    const sv=doc.siteVisit||{};
    set('sv-date',sv.date); set('sv-present',sv.present); set('sv-access',sv.access); set('sv-scope',sv.scope); set('sv-risks',sv.risks);
    loadSig(sv.signature);
    if(l.estimateId){ const oe=document.getElementById('open-est'); oe.href='/estimate.html?id='+encodeURIComponent(l.estimateId); oe.style.display=''; }
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(err){ document.getElementById('loading').textContent='Could not load lead: '+err.message; }
}
init();
</script>
</body>
</html>
