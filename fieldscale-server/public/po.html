<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldscale — Purchase Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fs-theme.css">
<style>
  .wrap{max-width:1040px}
  .pagebar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .pagebar input.title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;border:none;border-bottom:1px solid var(--paper-line);background:transparent;width:300px;padding:4px 2px}
  .pagebar input.title:focus{border-bottom-color:var(--cyan-dim)}
  .pagebar select{width:auto;padding:6px 8px}
  .pagebar .spacer{flex:1}
  .statuspill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;text-transform:capitalize}
  .statuspill.draft{background:var(--paper);color:var(--steel)}
  .statuspill.ordered{background:rgba(111,195,228,.2);color:var(--cyan-dim)}
  .statuspill.received{background:rgba(74,155,110,.15);color:var(--good)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  .block{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px}
  .block h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin:0 0 10px}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:12px;color:var(--steel);margin-bottom:3px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lines td,.lines th{padding:8px 8px}
  .lines input{padding:6px 7px}
  .lines select.unit-sel{padding:6px 4px;width:66px;font-family:'IBM Plex Mono',monospace}
  .rowdel{background:transparent;border:none;color:var(--steel-light);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:var(--radius)}
  .rowdel:hover{color:var(--danger);background:rgba(192,57,43,.08)}
  .amt{font-family:'IBM Plex Mono',monospace;white-space:nowrap}
  .dollar{display:inline-flex;align-items:center;gap:2px;justify-content:flex-end;color:var(--steel)}
  .lines-scroll{overflow-x:auto}
  .lineadd{display:flex;gap:8px;align-items:center;margin:12px 0 0;flex-wrap:wrap}
  .lineadd select{width:auto;min-width:280px;max-width:420px}
  .bottom{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:20px;align-items:start}
  .totals{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px}
  .totals .tr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
  .totals .tr .v{font-family:'IBM Plex Mono',monospace}
  .totals .tr.total{border-top:2px solid var(--charcoal);margin-top:6px;padding-top:10px;font-family:'Oswald',sans-serif;font-size:18px}
  textarea{min-height:80px;resize:vertical}
  @media (max-width:760px){ .grid2{grid-template-columns:1fr} .bottom{grid-template-columns:1fr} .row3{grid-template-columns:1fr 1fr} .pagebar input.title{width:100%;order:5} }
</style>
<meta name="fs-module" content="jobs">
<script src="/app-nav.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>FIELDSCALE</div>
  <nav>
    <a href="/">Takeoff</a>
    <a href="/leads.html">Leads</a>
    <a href="/customers.html">Customers</a>
    <a href="/proposals.html">Estimates</a>
    <a href="/jobs.html">Jobs</a>
    <a href="/schedule.html">Schedule</a>
    <a href="/purchase-orders.html">Purchase Orders</a>
    <a href="/workorders.html">Work Orders</a>
    <a href="/invoices.html">Invoices</a>
    <a href="/estimates.html">Price Book</a>
    <a href="/followups.html">Follow-ups</a>
    <a href="/reports.html">Reports</a>
    <a href="/company.html">Company</a>
    <a href="/admin.html" id="owner-nav">Owner</a>
  </nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <a href="#" id="logout-link" style="color:var(--steel-light);font-size:13px;margin-left:14px;text-decoration:none">Log out</a>
</header>

<div class="wrap">
  <div id="loading" class="loading">Loading…</div>
  <div id="content" style="display:none">
    <div class="pagebar">
      <a href="/purchase-orders.html" class="btn ghost">← Purchase Orders</a>
      <input class="title" id="po-name" placeholder="PO name / description" />
      <span class="statuspill draft" id="status-pill">draft</span>
      <select id="status" title="Where this order stands">
        <option value="draft">Draft</option>
        <option value="ordered">Ordered</option>
        <option value="received">Received</option>
      </select>
      <div class="spacer"></div>
      <button class="btn ghost" id="save-btn">Save</button>
      <button class="btn primary" id="pdf-btn">Generate PDF</button>
    </div>

    <div class="grid2">
      <div class="block">
        <h3>Supplier</h3>
        <div class="field"><label>Supplier name</label><input id="sp-name" placeholder="e.g. ABC Building Supply" /></div>
        <div class="row2">
          <div class="field"><label>Contact</label><input id="sp-contact" /></div>
          <div class="field"><label>Phone / email</label><input id="sp-phone" /></div>
        </div>
        <div class="field"><label>Address</label><input id="sp-address" /></div>
      </div>
      <div class="block">
        <h3>Order details</h3>
        <div class="field"><label>For job</label>
          <select id="job-id"><option value="">— Not linked to a job —</option></select>
        </div>
        <div class="row3">
          <div class="field"><label>PO #</label><input id="po-no" placeholder="auto" /></div>
          <div class="field"><label>Order date</label><input id="po-date" type="date" /></div>
          <div class="field"><label>Needed by</label><input id="po-need" type="date" /></div>
        </div>
      </div>
    </div>

    <div class="card lines-scroll">
      <table class="lines">
        <thead>
          <tr>
            <th>Item / material</th><th>Code</th><th class="num">Qty</th><th>Unit</th>
            <th class="num">Unit cost&nbsp;$</th><th class="num">Amount</th><th></th>
          </tr>
        </thead>
        <tbody id="lines"></tbody>
      </table>
    </div>
    <div class="lineadd">
      <select id="pb-select"><option value="">Add from price book…</option></select>
      <button class="btn ghost" id="add-pb">＋ Add item</button>
      <button class="btn ghost" id="add-blank">＋ Blank line</button>
    </div>

    <div class="bottom">
      <div class="block">
        <h3>Notes to supplier</h3>
        <textarea id="notes" placeholder="Delivery instructions, account #, special sizes…"></textarea>
      </div>
      <div class="totals">
        <div class="tr"><span>Items</span><span class="v" id="t-count">0</span></div>
        <div class="tr total"><span>Order total</span><span class="v" id="t-total">$0.00</span></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN_STORAGE='fieldscale_token';
function getToken(){ return localStorage.getItem(TOKEN_STORAGE); }
document.addEventListener('click',function(e){ if(e.target && e.target.id==='logout-link'){ e.preventDefault(); localStorage.removeItem('fieldscale_token'); localStorage.removeItem('fieldscale_username'); location.href='/'; } });
if(!getToken()){ location.href='/'; }
const poId = new URLSearchParams(location.search).get('id');
if(!poId){ location.href='/purchase-orders.html'; }

async function apiFetch(path, options={}){
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  const t=getToken(); if(t) headers['Authorization']='Bearer '+t;
  const res=await fetch(path, Object.assign({}, options, {headers}));
  if(res.status===401){ location.href='/'; throw new Error('Session expired'); }
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Request failed');
  return data;
}
function money(n){ return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pdfDate(v){ if(v==null||v==='') return ''; const s=String(v).trim(); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[2]+'-'+m[3]+'-'+m[1]; const d=new Date(typeof v==='number'?v:s); if(isNaN(d.getTime())) return s; const p=n=>String(n).padStart(2,'0'); return p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+d.getFullYear(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const UNIT_OPTS=['SF','LF','EA','CY','HR','LS'];
const UNIT_MAP={sqft:'SF',sf:'SF',lnft:'LF',lf:'LF',lin:'LF',each:'EA',ea:'EA',cuyd:'CY',cy:'CY',cy3:'CY',hour:'HR',hr:'HR',hrs:'HR',ls:'LS'};
function normUnit(u){ u=(u||'').trim(); return UNIT_MAP[u.toLowerCase()]||u; }
function unitSelect(i, cur){
  const n=normUnit(cur); const opts=UNIT_OPTS.slice();
  if(n && !opts.includes(n)) opts.unshift(n);
  return `<select class="unit-sel" data-i="${i}" data-f="unit"><option value="">—</option>`+
    opts.map(u=>`<option ${u===n?'selected':''}>${u}</option>`).join('')+`</select>`;
}
let toastTimer; function toast(m,e){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2200); }

let doc = { supplier:{}, lines:[] };
let pricebook = [];
let poName = 'Untitled PO';
let company = {};

function pbUnitCost(it){ return Math.round(((Number(it.material)||0)+(Number(it.labor)||0)+((Number(it.laborHours)||0)*(Number(it.laborRate)||0)))*(1+(Number(it.waste)||0)/100)*100)/100; }
function total(){ return doc.lines.reduce((s,l)=> s+(Number(l.qty)||0)*(Number(l.unitCost)||0), 0); }
function renderTotals(){
  document.getElementById('t-count').textContent=doc.lines.length;
  document.getElementById('t-total').textContent=money(total());
}
function renderLines(){
  const tb=document.getElementById('lines');
  if(!doc.lines.length){
    tb.innerHTML=`<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--steel)">
      No items yet. Add from your price book below, or add a blank line.</td></tr>`;
    renderTotals(); return;
  }
  tb.innerHTML=doc.lines.map((l,i)=>{
    const amt=(Number(l.qty)||0)*(Number(l.unitCost)||0);
    return `<tr>
      <td><input data-i="${i}" data-f="name" value="${escapeHtml(l.name)}" placeholder="Item / material" /></td>
      <td><input data-i="${i}" data-f="code" value="${escapeHtml(l.code)}" style="width:120px" /></td>
      <td class="num"><input class="num" data-i="${i}" data-f="qty" value="${l.qty}" inputmode="decimal" style="width:78px" /></td>
      <td>${unitSelect(i, l.unit)}</td>
      <td class="num"><span class="dollar">$<input class="num" data-i="${i}" data-f="unitCost" value="${l.unitCost}" inputmode="decimal" placeholder="0.00" style="width:84px" /></span></td>
      <td class="num amt" data-amt="${i}">${money(amt)}</td>
      <td class="num"><button class="rowdel" data-del="${i}" title="Remove">✕</button></td>
    </tr>`;
  }).join('');
  renderTotals();
}
document.getElementById('lines').addEventListener('input', e=>{
  const el=e.target, i=el.getAttribute('data-i'), f=el.getAttribute('data-f');
  if(i===null||i===undefined) return;
  const num=(f==='qty'||f==='unitCost');
  doc.lines[i][f]= num ? (parseFloat(el.value)||0) : el.value;
  if(num){
    const amt=(Number(doc.lines[i].qty)||0)*(Number(doc.lines[i].unitCost)||0);
    const cell=document.querySelector(`[data-amt="${i}"]`); if(cell) cell.textContent=money(amt);
    renderTotals();
  }
});
document.getElementById('lines').addEventListener('click', e=>{
  const d=e.target.getAttribute && e.target.getAttribute('data-del');
  if(d!==null && d!==undefined){ doc.lines.splice(Number(d),1); renderLines(); }
});
document.getElementById('add-blank').addEventListener('click', ()=>{
  doc.lines.push({ id:'l_'+Math.random().toString(16).slice(2,8), name:'', code:'', unit:'', qty:1, unitCost:0 });
  renderLines();
});
document.getElementById('add-pb').addEventListener('click', ()=>{
  const sel=document.getElementById('pb-select'); const idx=sel.value; if(idx==='') return;
  const it=pricebook[Number(idx)]; if(!it) return;
  doc.lines.push({ id:'l_'+Math.random().toString(16).slice(2,8), name:it.name, code:it.category||'', unit:it.unit||'', qty:1, unitCost:pbUnitCost(it) });
  sel.value=''; renderLines();
});
document.getElementById('status').addEventListener('change', ()=>{
  const s=document.getElementById('status').value;
  const pill=document.getElementById('status-pill'); pill.textContent=s; pill.className='statuspill '+s;
});

function val(id){ return document.getElementById(id).value; }
function set(id,v){ document.getElementById(id).value=(v==null?'':v); }
function syncDocFromForm(){
  poName=val('po-name')||'Untitled PO';
  doc.supplier={ name:val('sp-name'), contact:val('sp-contact'), phone:val('sp-phone'), address:val('sp-address') };
  doc.jobId=val('job-id'); doc.poNo=val('po-no'); doc.date=val('po-date'); doc.neededBy=val('po-need');
  doc.notes=val('notes');
}
async function save(){
  syncDocFromForm();
  await apiFetch('/api/purchase-orders/'+poId, { method:'PUT', body: JSON.stringify({
    name:poName, supplier:doc.supplier.name, jobId:doc.jobId||'', total:total(), status:val('status'), doc }) });
}
document.getElementById('save-btn').addEventListener('click', async ()=>{ try{ await save(); toast('Purchase order saved.'); }catch(err){ toast(err.message,true); } });
document.getElementById('pdf-btn').addEventListener('click', async ()=>{ try{ await save(); openPOPDF(); }catch(err){ toast(err.message,true); } });

function openPOPDF(){
  const rows=doc.lines.map((l,i)=>`<tr>
      <td class="c">${i+1}</td>
      <td>${escapeHtml(l.name)}${l.code?`<div class="code">${escapeHtml(l.code)}</div>`:''}</td>
      <td class="r">${Number(l.qty)||0}</td><td>${escapeHtml(normUnit(l.unit))}</td>
      <td class="r">${money(l.unitCost)}</td>
      <td class="r">${money((Number(l.qty)||0)*(Number(l.unitCost)||0))}</td>
    </tr>`).join('');
  const co=company||{}, sp=doc.supplier||{};
  const coLines=[co.phone,co.email,co.website,co.license?('Lic# '+co.license):'',co.address].filter(Boolean).map(escapeHtml).join('<br>');
  const logoImg = co.logo ? `<img src="${co.logo}" style="max-height:60px;max-width:220px;display:block;margin-bottom:8px" alt="">` : '';
  const jobName=(document.getElementById('job-id').selectedOptions[0]||{}).textContent||'';
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(poName)}</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} body{font-family:'IBM Plex Sans',Arial,sans-serif;color:#1C1E22;margin:0;padding:40px;font-size:13px}
  .head{display:flex;justify-content:space-between;border-bottom:3px solid #0E2A47;padding-bottom:16px;margin-bottom:20px}
  .co h1{font-family:'Oswald',sans-serif;font-size:24px;margin:0 0 4px;color:#0E2A47}
  .co .sub{color:#7C8896;font-size:12px}
  .doc{text-align:right}
  .doc .big{font-family:'Oswald',sans-serif;font-size:26px;color:#E8722C;letter-spacing:1px}
  .doc .meta{color:#7C8896;font-size:12px;margin-top:6px;line-height:1.5}
  .parties{display:flex;gap:40px;margin-bottom:20px}
  .parties h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7C8896;margin:0 0 4px}
  .parties .val{font-size:13px;line-height:1.5}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  th{background:#0E2A47;color:#F6F3EA;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  th.r,td.r{text-align:right} th.c,td.c{text-align:center}
  td{padding:8px 10px;border-bottom:1px solid #E4DFCF;vertical-align:top}
  td .code{color:#7C8896;font-size:11px;margin-top:2px}
  .totals{width:300px;margin-left:auto}
  .totals .tr{display:flex;justify-content:space-between;padding:5px 0}
  .totals .tr.total{border-top:2px solid #1C1E22;margin-top:4px;padding-top:8px;font-family:'Oswald',sans-serif;font-size:17px;color:#0E2A47}
  .sec{margin-top:22px} .sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7C8896;margin:0 0 6px;border-bottom:1px solid #E4DFCF;padding-bottom:4px}
  .sec .body{white-space:pre-wrap;line-height:1.5}
  .foot{margin-top:34px;color:#7C8896;font-size:11px;text-align:center;border-top:1px solid #E4DFCF;padding-top:12px}
  @media print{ body{padding:0} .noprint{display:none} @page{margin:16mm} }
  .bar{position:fixed;top:0;left:0;right:0;background:#0E2A47;padding:10px;text-align:center}
  .bar button{background:#E8722C;color:#fff;border:none;padding:9px 20px;border-radius:3px;font-size:14px;cursor:pointer;font-family:inherit}
  .spacer40{height:52px}
</style></head><body>
  <div class="bar noprint"><button onclick="window.print()">Save as PDF / Print</button></div>
  <div class="spacer40 noprint"></div>
  <div class="head">
    <div class="co">${logoImg}<h1>${escapeHtml(co.name||'Your Company')}</h1><div class="sub">${coLines||''}</div></div>
    <div class="doc"><div class="big">PURCHASE ORDER</div><div class="meta">
      ${doc.poNo?('No. '+escapeHtml(doc.poNo)+'<br>'):''}
      ${doc.date?('Date: '+escapeHtml(pdfDate(doc.date))+'<br>'):''}
      ${doc.neededBy?('Needed by: '+escapeHtml(pdfDate(doc.neededBy))):''}
    </div></div>
  </div>
  <div class="parties">
    <div><h4>Supplier</h4><div class="val"><strong>${escapeHtml(sp.name||'—')}</strong>${sp.contact?('<br>'+escapeHtml(sp.contact)):''}${sp.phone?('<br>'+escapeHtml(sp.phone)):''}${sp.address?('<br>'+escapeHtml(sp.address)):''}</div></div>
    ${(doc.jobId&&jobName&&!/Not linked/.test(jobName))?`<div><h4>For job</h4><div class="val">${escapeHtml(jobName)}</div></div>`:''}
  </div>
  <table>
    <thead><tr><th class="c">#</th><th>Item / material</th><th class="r">Qty</th><th>Unit</th><th class="r">Unit cost</th><th class="r">Amount</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:#7C8896;padding:20px">No items.</td></tr>'}</tbody>
  </table>
  <div class="totals">
    <div class="tr total"><span>Order total</span><span>${money(total())}</span></div>
  </div>
  ${doc.notes?`<div class="sec"><h4>Notes</h4><div class="body">${escapeHtml(doc.notes)}</div></div>`:''}
  <div class="foot">${escapeHtml(co.name||'')}</div>
</body></html>`;
  const w=window.open('','_blank');
  if(!w){ toast('Please allow pop-ups to generate the PDF.', true); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function fillJobs(jobs){
  const sel=document.getElementById('job-id');
  jobs.forEach(j=>{ const o=document.createElement('option'); o.value=j.id; o.textContent=j.name+(j.client?(' — '+j.client):''); sel.appendChild(o); });
}
function fillForm(){
  set('po-name',poName);
  const sp=doc.supplier||{};
  set('sp-name',sp.name); set('sp-contact',sp.contact); set('sp-phone',sp.phone); set('sp-address',sp.address);
  set('po-no',doc.poNo); set('po-date',doc.date); set('po-need',doc.neededBy); set('notes',doc.notes);
  document.getElementById('job-id').value=doc.jobId||'';
}
async function init(){
  try{ const me=await apiFetch('/api/me'); document.getElementById('who').textContent=me.username; }catch(e){ return; }
  try{
    const [po, pb, comp, jobs] = await Promise.all([
      apiFetch('/api/purchase-orders/'+poId), apiFetch('/api/pricebook'), apiFetch('/api/company'), apiFetch('/api/jobs') ]);
    poName = po.name || 'Untitled PO';
    doc = Object.assign({ supplier:{}, lines:[] }, po.doc||{});
    doc.supplier = doc.supplier||{}; doc.lines = doc.lines||[];
    pricebook = pb.items || [];
    company = (comp.profile) || {};
    document.getElementById('status').value = po.status || 'draft';
    document.getElementById('status').dispatchEvent(new Event('change'));
    fillJobs(jobs||[]);
    fillForm();
    // price-book dropdown
    const pbSel=document.getElementById('pb-select');
    pricebook.forEach((it,idx)=>{ const o=document.createElement('option'); o.value=idx; o.textContent=(it.name||'(unnamed)')+(it.unit?(' · '+it.unit):'')+' · '+money(pbUnitCost(it)); pbSel.appendChild(o); });
    renderLines();
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(err){ document.getElementById('loading').textContent='Could not load this purchase order: '+err.message; }
}
init();
</script>
</body>
</html>
